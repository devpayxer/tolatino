    sources:
      - path: App
      - path: Targets/ToLatinoPuerta
        excludes:
          - public
          - Info.plist
      - path: Targets/ToLatinoPuerta/public
        type: folder
      - path: ../plugins/tl-alcance/ios
      - path: ../plugins/tl-local/ios
      - path: ../plugins/tl-pantalla/ios
      - path: ../plugins/tl-reporte/ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tolatino.puerta
        PRODUCT_NAME: ToLatinoPuerta
        INFOPLIST_FILE: Targets/ToLatinoPuerta/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
