      - package: Capacitor
        product: Cordova
      - package: CapacitorApp
      - package: CapacitorAppLauncher
      - package: CapacitorSplashScreen
      - package: CapacitorStatusBar
schemes:
  ToLatino:
    build:
      targets:
        ToLatino: all
    run:
      config: Debug
  ToLatinoNegocios:
    build:
      targets:
        ToLatinoNegocios: all
    run:
      config: Debug
  ToLatinoRepartidor:
    build:
      targets:
        ToLatinoRepartidor: all
    run:
      config: Debug
  ToLatinoPuerta:
    build:
      targets:
        ToLatinoPuerta: all
    run:
      config: Debug
