// Módulo :app de las cuatro cáscaras. Los sabores (uno por app, con su id y solo sus plugins) salen de sabores.gradle, generado desde apps.json.
apply plugin: 'com.android.application'

def APPS = new groovy.json.JsonSlurper().parse(file('../../apps.json'))
def BUILD = (System.getenv('TL_BUILD') ?: '1') as Integer

android {
    namespace = "com.tolatino.cascara"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode BUILD
        versionName APPS.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Lo que no se empaqueta de las islas: archivos ocultos y de sistema.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        resValues = true
        buildConfig = true
    }
    // 8h · La firma de los builds release: el CI de las tiendas pone la llave de subida en un almacén TEMPORAL (del llavero por OIDC o, mientras
    // el servidor no tenga HTTPS, una desechable que dice «NO PARA DISTRIBUIR») y lo borra al terminar (if: always()). Nunca en el repo ni en
    // GitHub (guardián llavesFueraDelRepo). Sin TL_FIRMA_ALMACEN, el release sale sin firmar.
    def ALMACEN = System.getenv('TL_FIRMA_ALMACEN')
    signingConfigs {
        if (ALMACEN) {
            create('subida') {
                storeFile file(ALMACEN)
                storeType 'pkcs12'
                storePassword System.getenv('TL_FIRMA_CLAVE')
                keyAlias System.getenv('TL_FIRMA_ALIAS') ?: 'subida'
                keyPassword System.getenv('TL_FIRMA_CLAVE')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ALMACEN) signingConfig signingConfigs.subida
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

apply from: 'sabores.gradle'

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion" // MainActivity: el puente solo por addWebMessageListener
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
}
