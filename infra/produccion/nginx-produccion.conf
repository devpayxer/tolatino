# 9o · nginx de la máquina de la app de producción (y del ensayo). Lo instala infra/produccion/deploy.sh cambiando __DOMINIO__ (vacío en el ensayo:
# se sirve por la IP) y __RED_APP__ / __RED_RED__ (la IP privada de la app y la red privada). Las rutas son las del sandbox (nginx-pruebas.conf;
# guardián mismoPaquete) más lo de producción: HTTPS con el certificado de origen de Cloudflare («Full (strict)»), la IP real del vecino desde
# CF-Connecting-IP (solo si viene de un rango de Cloudflare), la página de mantenimiento y el registro que lee la vigilancia del azul/verde.
# El destino de la app (azul :3001 o verde :3002) vive en /etc/nginx/tolatino-activo.conf: lo cambia solo el azul/verde (infra/comun/azulverde.sh).

include /etc/nginx/tolatino-activo.conf;

log_format tolatino_vigia '$msec $status $request_time $upstream_addr';
# La IP real del vecino: solo de los rangos publicados de Cloudflare (los escribe el despliegue; vacío en el ensayo).
include /etc/nginx/tolatino-cloudflare.conf;

map $http_upgrade $tolatino_conexion { default upgrade; '' close; }
# La página de estado de las otras máquinas (sin entrada pública): por la red privada.
map $tl_maq $tl_maq_ip { base __RED_BASE__; replica __RED_REPLICA__; almacen __RED_ALMACEN__; default 127.0.0.1; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # El certificado de origen (Cloudflare «Full (strict)»): listen 443 ssl y sus archivos; vacío mientras no exista (ensayo, o antes de 8-0).
    include /etc/nginx/tolatino-ssl.conf;
    server_name __DOMINIO__;
    client_max_body_size 14m;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/tolatino-vigia.log tolatino_vigia;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # La página de mantenimiento: con la app caída (502/504 de nginx) o durante una ventana programada (el despliegue o el temporizador dejan
    # /var/lib/tolatino/mantenimiento/activo). Las rutas de la API (webhooks de Stripe, tiendas, pases), el Super Admin, la entrada y lo estático
    # siguen; solo las páginas de los vecinos ven el aviso.
    set $tolatino_mant 0;
    if (-f /var/lib/tolatino/mantenimiento/activo) { set $tolatino_mant 1; }
    if ($uri ~ ^/(api|admin|entrar|_next|estado|medios|teselas|\.well-known)(/|$)) { set $tolatino_mant 0; }
    if ($tolatino_mant = 1) { return 503; }
    error_page 502 503 504 /mantenimiento.html;
    location = /mantenimiento.html {
        root /var/www/mantenimiento;
        try_files /index.html =503;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 300 always;
    }

    # Página de estado del servidor (la escribe tolatino-sync): commit, último despliegue, la llave pública del sobre sellado.
    location = /estado { return 301 /estado/; }
    location ~ ^/estado/(?<tl_maq>base|replica|almacen)/(?<tl_arch>index\.html|llave\.txt|sobres\.txt|diag\.txt)?$ {
        proxy_pass http://$tl_maq_ip:8099/estado/$tl_arch;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /estado/ {
        alias /var/www/estado/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Teselas propias del mapa (tileserver-gl). Se guardan 7 días (Cloudflare las guarda también).
    location /teselas/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fotos (Garage en la máquina de la base, por la red privada). Un año: cada foto tiene nombre único. Lo privado nunca por aquí.
    location ^~ /medios/privado/ { return 404; }
    location ^~ /api/interno/ { return 404; }
    location ~* \.map$ { return 404; }
    location /medios/ {
        proxy_pass http://__RED_BASE__:3902/;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        limit_except GET HEAD { deny all; }
    }

    # 8h · Los archivos del CI de las tiendas: hasta 200 MB, solo esta ruta (Cloudflare gratis corta en 100 MB: los .aab y dSYM van por el sandbox).
    location = /api/tiendas/archivo {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass http://tolatino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://tolatino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tolatino_conexion;
        proxy_read_timeout 120s;
    }
}

# El barrido, el push y las alertas del monitoreo le hablan a la versión que sirve por aquí (solo la máquina y la red privada; /api/interno/ sí pasa).
server {
    listen 127.0.0.1:3000;
    listen __RED_APP__:3000;
    allow 127.0.0.1;
    allow __RED_RED__;
    deny all;
    access_log off;
    location / {
        proxy_pass http://tolatino_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}

# Los sobres privados de esta máquina para las otras (cifrados para cada una; infra/comun/sobres-privados.sh). Solo la red privada.
server {
    listen __RED_APP__:8099;
    allow __RED_RED__;
    deny all;
    access_log off;
    root /var/lib/tolatino/sobres-servidos;
    autoindex off;
    location ~ ^/[a-z]+\.age$ { try_files $uri =404; }
    location / { return 404; }
}
