# 9o · Lo que distingue a PRODUCCIÓN (lo carga infra/produccion/deploy.sh). Sin secretos: lo secreto nace en el servidor o llega sellado
# (infra/comun/secretos.json). El proveedor, la región y el tamaño de las máquinas se deciden con el precio del día (Paquete 9-3, fase9 §6 #2–#3).
TOLATINO_ENTORNO=produccion
TOLATINO_RAMA=produccion
# El dominio: Cloudflare delante (Paquete 8-0). nginx lo pone en server_name; la app lo usa para sus enlaces y las llaves de acceso.
TOLATINO_DOMINIO=tolatino.com
TOLATINO_URL=https://tolatino.com
PASSKEY_RP_ID=tolatino.com
PASSKEY_ORIGENES=https://tolatino.com
VAPID_SUJETO=https://tolatino.com
CORREO_DE=avisos@tolatino.com
# La red privada del proveedor (no son IPs públicas; las públicas nunca van al repo).
RED_RED=10.40.0.0/24
RED_BASE=10.40.0.2
RED_APP=10.40.0.3
RED_REPLICA=10.40.0.4
# Delante de la app solo Cloudflare (los rangos se ponen en nginx y en el firewall del proveedor).
DETRAS_DE_CLOUDFLARE=1
RAMA_RECUPERACION=recuperacion
# Los respaldos: almacén de objetos en OTRA región (fase9 §6 #4). El endpoint y el bucket los fija el Paquete 9-3; las llaves llegan selladas.
RESPALDO_S3_ENDPOINT=
RESPALDO_S3_REGION=
RESPALDO_S3_BUCKET=tolatino-respaldos-produccion
RESPALDO_S3_VERIFICAR_TLS=y
# El correo de las alertas del monitoreo (SES SMTP de la misma cuenta del correo; el destino llega sellado).
ALERTA_SMTP_HOST=email-smtp.us-east-1.amazonaws.com
DB_SHARED_BUFFERS=4GB
DB_CACHE=12GB
