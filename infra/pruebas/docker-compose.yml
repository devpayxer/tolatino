# Sandbox To'Latino (proyecto de pruebas). Lo levanta deploy.sh con /etc/tolatino/pruebas.env.
name: tolatino-pruebas
services:
  web:
    build:
      context: ../..
      dockerfile: infra/pruebas/Dockerfile
      args:
        TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
    image: tolatino/web:pruebas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TOLATINO_ENTORNO: pruebas
      TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
      DATABASE_URL: postgres://tolatino:${POSTGRES_PASSWORD}@db:5432/tolatino
      AUTH_SECRET: ${AUTH_SECRET}
      TOLATINO_SMS_MODO: pruebas
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: tolatino
      POSTGRES_USER: tolatino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tolatino -d tolatino"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Teselas propias (OpenStreetMap de Pensilvania): raster PNG para las piezas del sistema y vectorial para MapLibre.
  # Perfil «mapa»: deploy.sh solo lo enciende cuando infra/mapa/generar.sh ya dejó el .mbtiles.
  mapa:
    image: maptiler/tileserver-gl:v5.6.0
    profiles: ["mapa"]
    restart: unless-stopped
    command: ["--file", "/data/pennsylvania.mbtiles", "--public_url", "/teselas/"]
    volumes:
      - /var/lib/tolatino/mapa:/data:ro
    ports:
      - "127.0.0.1:8080:8080"

# Almacenamiento de archivos (S3 propio): entra con la subida de fotos, con Garage (dxflrs/garage).
# MinIO quedó fuera: sus imágenes públicas ya no se pueden bajar (5 nov 2026).

volumes:
  db-data:
