# Sandbox To'Latino (proyecto de pruebas). Lo levanta deploy.sh con /etc/tolatino/pruebas.env.
name: tolatino-pruebas
services:
  web:
    build:
      context: ../..
      dockerfile: infra/pruebas/Dockerfile
      args:
        TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
    image: tolatino/web:pruebas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TOLATINO_ENTORNO: pruebas
      TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
      DATABASE_URL: postgres://tolatino:${POSTGRES_PASSWORD}@db:5432/tolatino
      # 9g · La base de análisis (réplica de lectura): vacía en el sandbox, Analítica lee de la misma base (lib/db-analisis.ts).
      DATABASE_URL_ANALISIS: ${DATABASE_URL_ANALISIS:-}
      AUTH_SECRET: ${AUTH_SECRET}
      DATOS_SECRET: ${DATOS_SECRET:-}
      QR_LLAVE_PRIVADA: ${QR_LLAVE_PRIVADA:-}
      TOLATINO_SMS_MODO: pruebas
      MEDIOS_S3_URL: http://medios:3900
      MEDIOS_KEY_ID: ${MEDIOS_KEY_ID:-}
      MEDIOS_SECRET: ${MEDIOS_SECRET:-}
      BARRIDO_TOKEN: ${BARRIDO_TOKEN:-}
      # 8c · Web Push: la llave VAPID del entorno (la crea deploy.sh). Sin ella la app la deriva de DATOS_SECRET. APNs y FCM leen sus llaves del
      # llavero de las tiendas (Sistema › Integraciones), nunca de aquí.
      VAPID_PRIVADA: ${VAPID_PRIVADA:-}
      # 5d · Moderación de imágenes propia (regla `img`): solo por la red interna; si no responde, las fotos esperan revisión.
      MODERACION_IMG_URL: http://moderacion-img:8790
      # 5h · Traductor propio («Ver traducción»): la única dirección de traducción de la app, por la red interna. Si no responde, la
      # pantalla dice «La traducción no está disponible ahora.» y sigue igual. El texto de los vecinos nunca va a un tercero.
      TRADUCTOR_URL: http://traductor:5000
      # 7c · El Compa: la llave de Anthropic (Claude API, PLAN §8 «IA de El Compa (con tope)»). Vive solo en /etc/tolatino/pruebas.env, nunca en el
      # repo. Sin ella contesta el simulador del sandbox. La app es el único servicio que sale al proveedor de IA (por la red «default»); el
      # traductor y la moderación siguen sin salida. Solo lib/compa/modelo-claude.ts la lee (guardián compaSoloServidor).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 7h · El Compa por WhatsApp y SMS: la verificación de las firmas de entrada (la llave PÚBLICA de Telnyx y el secreto de la app de Meta),
      # el token de verificación del webhook de Meta y el token para mandar por WhatsApp. Viven solo en /etc/tolatino/pruebas.env (formulario
      # seguro del entorno), nunca en el repo. Sin ellos nada entra (401) y lo que «sale» queda en el simulador. Solo los lee
      # lib/compa/canales-proveedor.ts (guardián canalConFirma).
      TELNYX_PUBLIC_KEY: ${TELNYX_PUBLIC_KEY:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      # 8d · Llaves de acceso (Face ID / huella): el dominio de la cuenta (RP ID) y los orígenes que pueden firmar. No son secretos. Mientras el
      # sandbox se sirva por HTTP en la IP (sin el Paquete 8-0), el origen de la petición no está en la lista y la app NO ofrece llaves (el SMS
      # sigue igual). Con el dominio y HTTPS, funcionan sin tocar nada. El de Android (android:apk-key-hash:…) se suma cuando 8h firme las apps.
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-pruebas.tolatino.com}
      PASSKEY_ORIGENES: ${PASSKEY_ORIGENES:-https://pruebas.tolatino.com}
      # 8i · Las cuentas de revisión de Apple y Google: el código fijo de cada una (lo crea deploy.sh al azar). Solo los lee
      # lib/tiendas/revision.ts por el nombre exacto (guardián revisionAcotada); sin ellos, ninguna cuenta de revisión entra.
      REVISION_CODIGO_CLIENTE: ${REVISION_CODIGO_CLIENTE:-}
      REVISION_CODIGO_NEGOCIO: ${REVISION_CODIGO_NEGOCIO:-}
      REVISION_CODIGO_REPARTIDOR: ${REVISION_CODIGO_REPARTIDOR:-}
      REVISION_CODIGO_PUERTA: ${REVISION_CODIGO_PUERTA:-}
    networks: [default, interna]
    depends_on:
      db:
        condition: service_healthy

  # 5d · Moderación de imágenes propia (services/moderacion-img: NudeNet 3.4.2, MIT, ONNX en CPU). Sin puertos hacia afuera: solo
  # la app le habla por la red del compose. La app no la espera para arrancar: si está caída, las fotos nuevas de la Comunidad
  # quedan en «revisión manual» (cola Medios marcados), nunca publicadas sin revisar. Memoria acotada (cx33, 8 GB; §6 #24).
  #     Perfil propio (como el mapa): deploy.sh lo construye y lo enciende APARTE, así una falla al construir esta imagen nunca
  #     frena el despliegue de la app.
  moderacion-img:
    build:
      context: ../../services/moderacion-img
    image: tolatino/moderacion-img:pruebas
    profiles: ["moderacion"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  # 5h · Traductor propio: LibreTranslate 1.9.6 (AGPL-3.0, sin modificar, como servicio aparte) con los modelos Argos español ↔ inglés.
  # Solo en la red «interna» (internal: sin salida a internet y sin puertos hacia afuera): la app le habla y nadie más. La app no lo
  # espera para arrancar. Memoria acotada (cx33, 8 GB, junto a moderacion-img: §6 #24). Perfil propio (como moderacion y mapa):
  # deploy.sh lo baja y lo enciende APARTE con `|| true`, así una falla al bajar la imagen o los modelos nunca frena la app.
  #     Los modelos los baja UNA vez «traductor-modelos» (misma imagen, en la red con salida, solo es+en, al volumen) y termina; el
  #     traductor los lee del volumen y, con los modelos ya puestos, no sale a internet (LT_UPDATE_MODELS apagado).
  traductor-modelos:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["traductor"]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        ./venv/bin/python -c "import sys; from argostranslate import package as p, settings as s;
        c = {(x.from_code, x.to_code) for x in p.get_installed_packages()};
        sys.exit(0 if {('en', 'es'), ('es', 'en')} <= c and any((s.data_dir / 'minisbd').glob('*.onnx')) else 1)"
        || ./venv/bin/python scripts/install_models.py --load_only_lang_codes es,en
    volumes:
      - traductor-modelos:/home/libretranslate/.local
    mem_limit: 1g

  traductor:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["traductor"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: es,en
      LT_UPDATE_MODELS: "false"
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_CHAR_LIMIT: "2000"
      LT_THREADS: "2"
    volumes:
      - traductor-modelos:/home/libretranslate/.local
    networks: [interna]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "./venv/bin/python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # Barrido central (0078): cada minuto llama a la app por la red interna para vencer, liberar y avisar aunque nadie abra una
  # página. Usa la misma imagen de la app (nada nuevo que bajar) y el token del entorno (lo crea deploy.sh).
  barrido:
    image: tolatino/web:pruebas
    pull_policy: never # la construye el servicio web en este mismo `up --build`
    restart: unless-stopped
    environment:
      BARRIDO_TOKEN: ${BARRIDO_TOKEN:-}
    command: ["node", "-e", "const t=process.env.BARRIDO_TOKEN;const go=async()=>{try{const r=await fetch('http://web:3000/api/interno/barrido',{method:'POST',headers:{'x-barrido-token':t},signal:AbortSignal.timeout(55000)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)console.error(new Date().toISOString(),'barrido',r.status,JSON.stringify(j))}catch(e){console.error(new Date().toISOString(),'barrido',e.message)}};setTimeout(go,30000);setInterval(go,60000)"]
    depends_on:
      - web

  # 8c · El trabajador de push (fase8-apps.md §3.3): cada 5 s le pide a la app que mande lo que hay en la cola (además del empujón que da cada
  # aviso al encolarse y del barrido de cada minuto, que reintenta y vence). Misma imagen, mismo token del barrido, solo por la red interna.
  # Caído: los avisos siguen en la campana y el SMS de respaldo sale al vencer push_ttl_h (el barrido).
  push:
    image: tolatino/web:pruebas
    pull_policy: never # la construye el servicio web en este mismo `up --build`
    restart: unless-stopped
    environment:
      BARRIDO_TOKEN: ${BARRIDO_TOKEN:-}
    command: ["node", "-e", "const t=process.env.BARRIDO_TOKEN;let ocupado=false;const go=async()=>{if(ocupado)return;ocupado=true;try{const r=await fetch('http://web:3000/api/interno/push',{method:'POST',headers:{'x-barrido-token':t},signal:AbortSignal.timeout(30000)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)console.error(new Date().toISOString(),'push',r.status,JSON.stringify(j))}catch(e){console.error(new Date().toISOString(),'push',e.message)}finally{ocupado=false}};setTimeout(go,20000);setInterval(go,5000)"]
    depends_on:
      - web

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: tolatino
      POSTGRES_USER: tolatino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tolatino -d tolatino"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Teselas propias (OpenStreetMap de Pensilvania): raster PNG para las piezas del sistema y vectorial para MapLibre.
  # Perfil «mapa»: deploy.sh solo lo enciende cuando infra/mapa/generar.sh ya dejó el .mbtiles.
  mapa:
    image: maptiler/tileserver-gl:v5.6.0
    profiles: ["mapa"]
    restart: unless-stopped
    command: ["--file", "/data/pennsylvania.mbtiles", "--public_url", "/teselas/"]
    volumes:
      - /var/lib/tolatino/mapa:/data:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Fotos: S3 propio (Garage, código abierto). La configuración con sus secretos la escribe infra/pruebas/medios.sh en
  # /etc/tolatino/garage.toml (nunca en el repo). nginx sirve el bucket público en /medios/. MinIO quedó fuera: sus
  # imágenes públicas ya no se pueden bajar (5 nov 2026).
  medios:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - /etc/tolatino/garage.toml:/etc/garage.toml:ro
      - /var/lib/tolatino/medios:/var/lib/garage
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"

volumes:
  db-data:
  traductor-modelos:

networks:
  default: {}
  # 5h · Red sin salida a internet: la app (que también está en «default») le habla al traductor; el traductor no ve otra cosa.
  interna:
    internal: true
