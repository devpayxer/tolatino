# Sandbox To'Latino (proyecto de pruebas). Lo levanta deploy.sh con /etc/tolatino/pruebas.env.
name: tolatino-pruebas
services:
  web:
    build:
      context: ../..
      dockerfile: infra/pruebas/Dockerfile
      args:
        TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
    image: tolatino/web:pruebas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TOLATINO_ENTORNO: pruebas
      TOLATINO_COMMIT: ${TOLATINO_COMMIT:-desconocido}
      DATABASE_URL: postgres://tolatino:${POSTGRES_PASSWORD}@db:5432/tolatino
      AUTH_SECRET: ${AUTH_SECRET}
      DATOS_SECRET: ${DATOS_SECRET:-}
      TOLATINO_SMS_MODO: pruebas
      MEDIOS_S3_URL: http://medios:3900
      MEDIOS_KEY_ID: ${MEDIOS_KEY_ID:-}
      MEDIOS_SECRET: ${MEDIOS_SECRET:-}
      BARRIDO_TOKEN: ${BARRIDO_TOKEN:-}
      # 5d · Moderación de imágenes propia (regla `img`): solo por la red interna; si no responde, las fotos esperan revisión.
      MODERACION_IMG_URL: http://moderacion-img:8790
    depends_on:
      db:
        condition: service_healthy

  # 5d · Moderación de imágenes propia (services/moderacion-img: NudeNet 3.4.2, MIT, ONNX en CPU). Sin puertos hacia afuera: solo
  # la app le habla por la red del compose. La app no la espera para arrancar: si está caída, las fotos nuevas de la Comunidad
  # quedan en «revisión manual» (cola Medios marcados), nunca publicadas sin revisar. Memoria acotada (cx33, 8 GB; §6 #24).
  #     Perfil propio (como el mapa): deploy.sh lo construye y lo enciende APARTE, así una falla al construir esta imagen nunca
  #     frena el despliegue de la app.
  moderacion-img:
    build:
      context: ../../services/moderacion-img
    image: tolatino/moderacion-img:pruebas
    profiles: ["moderacion"]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  # Barrido central (0078): cada minuto llama a la app por la red interna para vencer, liberar y avisar aunque nadie abra una
  # página. Usa la misma imagen de la app (nada nuevo que bajar) y el token del entorno (lo crea deploy.sh).
  barrido:
    image: tolatino/web:pruebas
    pull_policy: never # la construye el servicio web en este mismo `up --build`
    restart: unless-stopped
    environment:
      BARRIDO_TOKEN: ${BARRIDO_TOKEN:-}
    command: ["node", "-e", "const t=process.env.BARRIDO_TOKEN;const go=async()=>{try{const r=await fetch('http://web:3000/api/interno/barrido',{method:'POST',headers:{'x-barrido-token':t},signal:AbortSignal.timeout(55000)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)console.error(new Date().toISOString(),'barrido',r.status,JSON.stringify(j))}catch(e){console.error(new Date().toISOString(),'barrido',e.message)}};setTimeout(go,30000);setInterval(go,60000)"]
    depends_on:
      - web

  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: tolatino
      POSTGRES_USER: tolatino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tolatino -d tolatino"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Teselas propias (OpenStreetMap de Pensilvania): raster PNG para las piezas del sistema y vectorial para MapLibre.
  # Perfil «mapa»: deploy.sh solo lo enciende cuando infra/mapa/generar.sh ya dejó el .mbtiles.
  mapa:
    image: maptiler/tileserver-gl:v5.6.0
    profiles: ["mapa"]
    restart: unless-stopped
    command: ["--file", "/data/pennsylvania.mbtiles", "--public_url", "/teselas/"]
    volumes:
      - /var/lib/tolatino/mapa:/data:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Fotos: S3 propio (Garage, código abierto). La configuración con sus secretos la escribe infra/pruebas/medios.sh en
  # /etc/tolatino/garage.toml (nunca en el repo). nginx sirve el bucket público en /medios/. MinIO quedó fuera: sus
  # imágenes públicas ya no se pueden bajar (5 nov 2026).
  medios:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - /etc/tolatino/garage.toml:/etc/garage.toml:ro
      - /var/lib/tolatino/medios:/var/lib/garage
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3902:3902"

volumes:
  db-data:
