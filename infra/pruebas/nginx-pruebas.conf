server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 14m;

    # Página de estado del servidor (la escribe tolatino-sync).
    location = /estado { return 301 /estado/; }
    location /estado/ {
        alias /var/www/estado/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # Teselas propias del mapa (tileserver-gl). Se guardan en el navegador 7 días.
    location /teselas/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }

    # Fotos (Garage, sitio web del bucket «medios»). Se guardan en el navegador un año: cada foto tiene nombre único.
    # Documentos privados (reclamos de negocio): nunca se sirven por aquí; el equipo los ve por una ruta con permiso.
    location ^~ /medios/privado/ { return 404; }
    # El barrido central solo se llama por la red interna de docker (servicio «barrido»), nunca desde fuera.
    location ^~ /api/interno/ { return 404; }

    location /medios/ {
        proxy_pass http://127.0.0.1:3902/;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        limit_except GET HEAD { deny all; }
    }

    # La app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
