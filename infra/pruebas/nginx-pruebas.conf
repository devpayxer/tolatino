server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 14m;
    # 9h · El sandbox no se indexa NUNCA (guardián sandboxNoSeIndexa): esta cabecera en todo lo que sale de aquí, además del robots.txt «Disallow: /»
    # y el noindex de la app. Las ubicaciones con su propio add_header la repiten (nginx no hereda add_header si la ubicación pone uno).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Página de estado del servidor (la escribe tolatino-sync).
    location = /estado { return 301 /estado/; }
    location /estado/ {
        alias /var/www/estado/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Teselas propias del mapa (tileserver-gl). Se guardan en el navegador 7 días.
    location /teselas/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Fotos (Garage, sitio web del bucket «medios»). Se guardan en el navegador un año: cada foto tiene nombre único.
    # Documentos privados (reclamos de negocio): nunca se sirven por aquí; el equipo los ve por una ruta con permiso.
    location ^~ /medios/privado/ { return 404; }
    # El barrido central solo se llama por la red interna de docker (servicio «barrido»), nunca desde fuera.
    location ^~ /api/interno/ { return 404; }
    # 8f · Los mapas de fuente simbolizan los errores en el servidor; nunca salen (además ya no están en lo que Next sirve).
    location ~* \.map$ { return 404; }

    location /medios/ {
        proxy_pass http://127.0.0.1:3902/;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_except GET HEAD { deny all; }
    }

    # 8h · Los archivos del CI de las tiendas (APK, .aab, símbolos): hasta 200 MB (tiendas_archivo_mb), solo esta ruta. Sin HTTPS, la app los rechaza.
    location = /api/tiendas/archivo {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # La app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
