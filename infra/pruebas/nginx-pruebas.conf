server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 14m;
    server_tokens off;

    # 22 nov · Mientras la app cambia de contenedor (unos segundos en cada despliegue) o si no contesta, nginx no enseña su «502 Bad Gateway»: la página
    # de mantenimiento del sistema de diseño (la de producción, infra/comun/mantenimiento/index.html; la instala deploy.sh) con 503 y Retry-After. Solo
    # para los errores del propio nginx (502/504: la app no contesta); un 503 que manda la app (p. ej. /api/salud sin base) pasa tal cual.
    error_page 502 504 =503 /mantenimiento.html;

    # 9h · El sandbox no se indexa NUNCA (guardián sandboxNoSeIndexa): esta cabecera en todo lo que sale de aquí, además del robots.txt «Disallow: /»
    # y el noindex de la app. Las ubicaciones con su propio add_header la repiten (nginx no hereda add_header si la ubicación pone uno).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Página de estado del servidor (la escribe tolatino-sync).
    location = /estado { return 301 /estado/; }
    location /estado/ {
        alias /var/www/estado/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # 23 nov · El estado del sitio de vista previa (lo escribe su bucle, infra/pruebas/vista-previa/vista.sh): rama, commit, sirviendo o en pausa.
    location = /estado/vista.txt {
        alias /var/lib/tolatino/vista/control/estado.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Teselas propias del mapa (tileserver-gl). Se guardan en el navegador 7 días.
    location /teselas/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Fotos (Garage, sitio web del bucket «medios»). Se guardan en el navegador un año: cada foto tiene nombre único.
    # Documentos privados (reclamos de negocio): nunca se sirven por aquí; el equipo los ve por una ruta con permiso.
    location ^~ /medios/privado/ { return 404; }
    # El barrido central solo se llama por la red interna de docker (servicio «barrido»), nunca desde fuera.
    location ^~ /api/interno/ { return 404; }
    # 8f · Los mapas de fuente simbolizan los errores en el servidor; nunca salen (además ya no están en lo que Next sirve).
    location ~* \.map$ { return 404; }

    location /medios/ {
        proxy_pass http://127.0.0.1:3902/;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_except GET HEAD { deny all; }
    }

    # Fotos a la medida (decisión AI; apps/web/lib/fotos-variantes.ts): las variantes WebP de cada foto pública, /medios/n/<uuid>.w<ancho>.webp.
    # La real se guarda un año (nombre fijo, contenido fijo). Nunca una foto rota: si la variante no existe (foto de antes sin convertir, un fallo
    # al generarla) o el navegador no dice que acepta WebP, en ESA MISMA dirección sale la maestra JPEG (/medios/n/<uuid>.jpg) con caché de 60 s,
    # para que la variante de verdad se vea en cuanto exista. Vary: Accept porque la respuesta depende de lo que acepta el navegador. Sin WebP la
    # respuesta es «private»: ningún caché compartido (Cloudflare no separa por Accept) se la da a quien sí acepta WebP. La caché del almacén
    # (un año, la guarda guardarObjeto) se esconde y manda la de aquí. Prueba: pruebas/infra/medios-nginx.test.sh. Guardián fotosConVariantes.
    location ~ ^/medios/n/[0-9a-f-]+\.w[0-9]+\.webp$ {
        error_page 404 = @tl_maestra;
        error_page 418 = @tl_maestra_sin_webp;
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_except GET HEAD { deny all; }
        if ($http_accept !~* "image/webp") { return 418; }
        rewrite ^/medios/(.*)$ /$1 break;
    }
    # La variante no existe: la maestra, 60 s (en el navegador y en Cloudflare). Llega con la dirección ya sin «/medios» (la reescribió la
    # ubicación de arriba antes de pedirla al almacén); sin WebP llega con «/medios» (no se reescribió): el patrón acepta las dos.
    location @tl_maestra {
        rewrite ^(?:/medios)?/n/([0-9a-f-]+)\.w[0-9]+\.webp$ /n/$1.jpg break;
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60" always;
        add_header Vary Accept always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_except GET HEAD { deny all; }
    }
    # El navegador no acepta WebP: la maestra, 60 s y solo en ese navegador.
    location @tl_maestra_sin_webp {
        rewrite ^(?:/medios)?/n/([0-9a-f-]+)\.w[0-9]+\.webp$ /n/$1.jpg break;
        proxy_pass http://127.0.0.1:3902;
        proxy_set_header Host medios.web.garage;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=60" always;
        add_header Vary Accept always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_except GET HEAD { deny all; }
    }

    # 8h · Los archivos del CI de las tiendas (APK, .aab, símbolos): hasta 200 MB (tiendas_archivo_mb), solo esta ruta. Sin HTTPS, la app los rechaza.
    location = /api/tiendas/archivo {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # C-001 · El video de presentación del negocio: hasta 120 MB solo en esta ruta (el servicio propio lo deja en 30 s y 720p).
    location = /api/negocio/video {
        client_max_body_size 120m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # La página de mantenimiento (ver error_page arriba): solo por dentro, nunca se pide directo.
    location = /mantenimiento.html {
        root /var/www/mantenimiento;
        try_files /index.html =503;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 10 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # La app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# 23 nov · Sitio de vista previa (SOLO el sandbox; infra/pruebas/vista-previa/, guardián vistaPreviaAcotada): la web en modo desarrollo sobre la rama de
# trabajo (vista.conf · VISTA_RAMA), para ver un ajuste de pantalla en 1-2 minutos sin construir la imagen. En el puerto 8081 de la MISMA dirección
# (http://<IP del sandbox>:8081): no exige tocar DNS ni nada a mano. Igual de abierta que el sandbox (que hoy no pide nada), nunca más: las mismas
# rutas cerradas, noindex y la página de mantenimiento si no contesta. Las fotos y las teselas son las del sandbox (se piden al puerto 80).
#   · control/pausa (lo deja vista.sh): la rama trae migraciones que la base no tiene → 503 con la página de pausa (vista-previa/pausa.html).
#   · control/apagada (lo deja encender.sh con VISTA_ENCENDIDA=0) → 404.
#   · Cada página lleva la marca «VISTA PREVIA» (la pieza Tag del sistema, armada por vista-previa/pagina.mjs; Accept-Encoding vacío para poder ponerla).
server {
    listen 8081;
    listen [::]:8081;
    server_name _;
    client_max_body_size 14m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 502 504 =503 /mantenimiento.html;
    error_page 503 /vista-pausa.html;

    location ^~ /medios/privado/ { return 404; }
    location ^~ /api/interno/ { return 404; }
    location ~* \.map$ { return 404; }

    location /medios/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_hide_header X-Robots-Tag;
    }
    location /teselas/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_hide_header X-Robots-Tag;
    }

    location = /mantenimiento.html {
        root /var/www/mantenimiento;
        try_files /index.html =503;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 10 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /vista-pausa.html {
        root /var/www/vista;
        try_files /pausa.html =404;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        if (-f /var/lib/tolatino/vista/control/apagada) { return 404; }
        if (-f /var/lib/tolatino/vista/control/pausa) { return 503; }
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        sub_filter_once on;
        sub_filter '</body>' '<a href="http://$host/" data-vista-previa style="position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:2147483647;display:inline-block;padding:3px 7px;border-radius:5px;background:var(--tl-ink,#0B0E12);color:var(--tl-white,#FFFFFF);font:800 9px JetBrains Mono,monospace;letter-spacing:.08em;white-space:nowrap;text-decoration:none" title="Vista previa de la rama de trabajo · Branch preview">VISTA PREVIA · PREVIEW</a></body>';
    }
}
