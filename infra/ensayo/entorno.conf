# 9o · El ENSAYO: una «producción de mentira» idéntica a producción (el mismo infra/produccion/deploy.sh, los mismos compose y nginx), en máquinas
# desechables del proyecto de pruebas, SIN datos reales y sin dominio (se sirve por la IP). La crea y la destruye scripts/produccion/ensayo.sh; sus
# llaves públicas y sus sobres viven solo en la rama «ensayo» (nunca en main). Una cuarta máquina «almacen» hace de almacén de objetos (Garage con TLS
# propio) para no depender de credenciales creadas a mano: la llave del almacén la genera el ensayo y llega sellada, como en producción.
