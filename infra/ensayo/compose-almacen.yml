# 9o · SOLO EL ENSAYO: la máquina «almacen» hace de almacén de objetos de los respaldos (en producción es el almacén del proveedor en otra región).
# Garage (el mismo del sandbox) detrás de un nginx con TLS propio (pgBackRest siempre habla TLS; el certificado lo hace la máquina al nacer). Solo la red
# privada del ensayo.
name: tolatino-almacen
services:
  medios:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - /etc/tolatino/garage.toml:/etc/garage.toml:ro
      - /var/lib/tolatino/medios:/var/lib/garage

  tls:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        printf 'server { listen 3443 ssl; ssl_certificate /tls/cert.pem; ssl_certificate_key /tls/key.pem; client_max_body_size 0;
        location / { proxy_pass http://medios:3900; proxy_set_header Host $$host; proxy_request_buffering off; proxy_buffering off; } }'
        > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    volumes:
      - /etc/tolatino/almacen-tls:/tls:ro
    ports:
      - "${RED_YO:?falta la IP privada}:3443:3443"

  sobres:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    volumes:
      - /var/lib/tolatino/sobres-servidos:/usr/share/nginx/html:ro
    ports:
      - "${RED_YO}:8099:80"
