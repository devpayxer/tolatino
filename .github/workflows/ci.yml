name: CI
# 9b-2 · La tubería completa (PLAN §3.4, §5): tipos · build · guardianes (verificar) · seguridad (Semgrep + dependencias) · la regresión entera de punta a
# punta por grupos, cada uno con su base nueva (regresion) · los 9 dispositivos con capturas aprobadas, axe y velocidad (dispositivos) · y «tuberia», que
# solo da verde si todo lo anterior dio verde. «alcance» (solo a mano) deja correr una parte mientras se afina; en push, pull_request y programado
# siempre es «todo». «aprobar=si» escribe las capturas como las aprobadas (artefacto; entran por commit, ver docs/REVISION.md). «confirmar=si» vuelve
# a correr cada grupo sobre la MISMA base y otra vez barajado (la confirmación de 9b-1). Programado a dos horas distintas del día: las pruebas
# atadas a la hora salieron una por franja (4:45 AM, 6 AM, media tarde, 6 PM, 7 AM de Tokio).
# 22 nov · Un push a main que solo cambia documentos de trabajo (la lista de scripts/ci/alcance.mjs) no corre los carriles largos: «cambios» lo
# calcula y es la ÚNICA vía para que no corran en un push (guardián ciSoloDocumentos). Los guardianes, los textos y la seguridad corren siempre.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
    - cron: "43 20 * * *"
  workflow_dispatch:
    inputs:
      alcance:
        description: "Qué corre (a mano): todo · pantallas (9 dispositivos, capturas, axe, velocidad) · regresion"
        type: choice
        options: [todo, pantallas, regresion]
        default: todo
      aprobar:
        description: "Escribir las capturas de esta corrida como las aprobadas (artefacto visual-aprobadas-*)"
        type: choice
        options: ["no", "si"]
        default: "no"
      medir:
        description: "Velocidad: solo imprimir las cifras (para fijar el presupuesto), sin fallar"
        type: choice
        options: ["no", "si"]
        default: "no"
      solo:
        description: "Regresión (a mano): solo estas pruebas, por nombre y separadas por espacio (para afinar una roja sin esperar 70 min); vacío = todo"
        type: string
        default: ""
      confirmar:
        description: "Regresión: cada grupo dos veces seguidas en la misma base y otra vez barajado"
        type: choice
        options: ["no", "si"]
        default: "no"
      semilla:
        description: "Confirmación barajada: la semilla del orden (para repetir una corrida); vacío = al azar"
        type: string
        default: ""
      anchos:
        description: "Toda la punta a punta también en los anchos extremos (iPhone SE, iPad, escritorio 1024); programado: siempre"
        type: choice
        options: ["no", "si"]
        default: "no"
      partes:
        description: "En cuántos trabajos paralelos se reparte cada carril largo (cada parte en su base nueva; cada prueba prepara sus datos)"
        type: choice
        options: ["1", "4"]
        default: "4"

permissions:
  contents: read

# Un push nuevo a una rama cancela la corrida vieja de esa rama (main nunca). Las corridas a mano (workflow_dispatch: «solo estas pruebas»,
# anchos) llevan su propio grupo: dos dirigidas seguidas ya no se cancelan entre sí (16 nov: una en cola canceló la combinada).
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 22 nov · El alcance de un push: «todo» o «documentos» (scripts/ci/alcance.mjs, probado en alreves9vd). Cualquier duda o error = «todo»; si el
  # script cae, el paso escribe «todo». pull_request, programado y a mano: siempre «todo».
  cambios:
    name: alcance (todo o solo documentos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alcance: ${{ steps.calcular.outputs.alcance }}
      n: ${{ steps.calcular.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: calcular
        env: { EVENTO: "${{ github.event_name }}", ANTES: "${{ github.event.before }}", DESPUES: "${{ github.sha }}" }
        run: node scripts/ci/alcance.mjs || echo "alcance=todo" >> "$GITHUB_OUTPUT"

  verificar:
    name: tipos · build · guardianes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm guardianes
      - name: Contrato con Stripe (stripe-mock valida cada llamada contra la API oficial)
        run: |
          docker run -d --rm --name stripe-mock -p 12111:12111 stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
          for i in $(seq 1 30); do curl -sf -u sk_test_123: http://127.0.0.1:12111/v1/accounts/acct_1 > /dev/null && break; sleep 1; done
          bash scripts/contrato-stripe/correr.sh
      - name: Contrato de WhatsApp y SMS (la especificación oficial de Telnyx y de Meta valida cada llamada de El Compa)
        run: bash scripts/contrato-canales/correr.sh
      - name: Contrato del push propio (Web Push con el vector del RFC 8291 y http_ece; APNs con las tablas de Apple; FCM v1 con su especificación oficial)
        run: bash scripts/contrato-push/correr.sh
      - name: Contrato de las tiendas (App Store Connect con su especificación OpenAPI fijada; Google Play con su descubrimiento oficial)
        run: bash scripts/contrato-tiendas/correr.sh
      - name: Contrato del OIDC de GitHub (cada rechazo con tokens firmados por una llave de prueba que imita la de GitHub)
        run: bash scripts/contrato-oidc/correr.sh
      - name: Contrato de Wallet (Apple con su formato fijado y una cadena de prueba hecha en el momento; Google con su descubrimiento oficial)
        run: bash scripts/contrato-wallet/correr.sh
      - name: Ningún mapa de fuente en lo que se sirve (el build los saca a .next/mapas)
        run: test -z "$(find apps/web/.next/static -name '*.map' -print -quit)" && test -n "$(find apps/web/.next/standalone/apps/web/.next/mapas -name '*.map' -print -quit)"
      - name: Firma del correo (SES SigV4) contra el vector oficial de AWS
        run: node scripts/prueba-firma-ses/prueba.mjs
      - name: Imagen del sandbox se construye
        run: docker build -f infra/pruebas/Dockerfile -t tolatino/web:ci .
      - name: Producción como código sin servidor (azul/verde, sobre sellado, recuperación, PITR de verdad con pgBackRest, la traza del sandbox, compose)
        run: |
          # El PITR se saltaba (18 nov): sin «apt-get update» no siempre llegaba pgbackrest y la imagen no trae el servidor de Postgres 16. Se instala
          # SIN crear la base de siempre (createcluster.conf): la prueba arma la suya en otro puerto y no choca con la base del CI.
          sudo mkdir -p /etc/postgresql-common && echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          # La imagen del CI es un Ubuntu nuevo sin postgresql-16 en sus listas: se agrega el repositorio oficial de PostgreSQL (PGDG), que trae el 16
          # (el de producción, infra/produccion/base) y su pgbackrest.
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q postgresql-common >/dev/null && sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -q age shellcheck pgbackrest postgresql-16 >/dev/null
          echo "pgbackrest: $(command -v pgbackrest || echo falta) · Postgres 16: $(test -x /usr/lib/postgresql/16/bin/initdb && echo sí || echo falta)"
          sudo -E env "PATH=$PATH" CI=true bash pruebas/infra/correr.sh
      - name: Imagen de la base de producción se construye (Postgres + PostGIS + pgBackRest)
        run: docker build -t tolatino/base:ci infra/produccion/base
      - name: Migraciones en una base real (dos veces, la segunda no cambia nada)
        env: { POSTGRES_PASSWORD: ci, TOLATINO_COMMIT: ci }
        run: |
          C="docker compose -p ci -f infra/pruebas/docker-compose.yml"
          $C up -d db
          for i in $(seq 1 60); do $C exec -T db pg_isready -h 127.0.0.1 -U tolatino -d tolatino && break; sleep 2; done
          bash packages/db/migrar.sh $C
          bash packages/db/migrar.sh $C
          test "$($C exec -T db psql -h 127.0.0.1 -U tolatino -d tolatino -qAt -c 'select count(*) from categories')" = "17"
          test "$($C exec -T db psql -h 127.0.0.1 -U tolatino -d tolatino -qAt -c 'select count(*) from cities')" = "5"
      - name: Centro de ayuda indexado (dos veces; la segunda no cambia nada y un admin-* nunca es de vecinos)
        env: { POSTGRES_PASSWORD: ci, TOLATINO_COMMIT: ci }
        run: |
          C="docker compose -p ci -f infra/pruebas/docker-compose.yml"
          Q() { $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt -c "$1"; }
          node scripts/ayuda/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt
          n1=$(Q "select count(*) from help_article_log")
          out=$(node scripts/ayuda/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt); echo "$out"
          echo "$out" | grep -q " 0 nuevos · 0 cambiados"
          test "$(Q "select count(*) from help_article_log")" = "$n1"
          test "$(Q "select count(*) from help_articles where status = 'live'")" = "$(ls docs/ayuda/*.md | wc -l)"
          test "$(Q "select count(*) from help_articles where slug like 'admin-%' and audience <> 'equipo'")" = "0"
          test "$(Q "select count(*) from help_chunks c join help_articles a using (slug) where a.audience = 'equipo' and c.audience <> 'equipo'")" = "0"
          test -n "$(Q "select slug from help_chunks where tsv @@ ayuda_consulta('devolución', 'es') and audience = 'vecino' limit 1")"
          test -n "$(Q "select slug from help_chunks where tsv @@ ayuda_consulta('refund', 'en') and audience = 'vecino' limit 1")"
      - name: Páginas legales indexadas (dos veces; la segunda no cambia nada y sin la semilla del sandbox nada se publica sin revisión)
        env: { POSTGRES_PASSWORD: ci, TOLATINO_COMMIT: ci }
        run: |
          C="docker compose -p ci -f infra/pruebas/docker-compose.yml"
          Q() { $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt -c "$1"; }
          node scripts/legal/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt
          n1=$(Q "select count(*) from legal_pages")
          out=$(node scripts/legal/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt); echo "$out"
          echo "$out" | grep -q " 0 nuevas · 0 cambiadas"
          test "$(Q "select count(*) from legal_pages")" = "$n1"
          test "$(Q "select count(*) from legal_pages where status = 'borrador'")" = "$(ls docs/legal/*/*.es.md | wc -l)"
          test "$(Q "select legal_entorno()")" = "produccion"
          if err=$(Q "update legal_pages set status = 'publicado', published_by = (select id from users limit 1), published_at = now(), publish_reason = 'ci' where key = 'terminos' and jurisdiction = 'us'" 2>&1); then echo "✗ se publicó sin revisión en una base sin la semilla del sandbox"; exit 1; fi
          echo "$err" | grep -q "legal_revisado"
      - name: Cadenas de la interfaz indexadas (dos veces; la segunda no cambia nada, una línea fija no se edita y una edición sin autor se rechaza)
        env: { POSTGRES_PASSWORD: ci, TOLATINO_COMMIT: ci }
        run: |
          C="docker compose -p ci -f infra/pruebas/docker-compose.yml"
          Q() { $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt -c "$1"; }
          node scripts/cms/extraer.mjs --verificar
          node scripts/cms/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt
          n1=$(Q "select count(*) from cms_string_versions")
          out=$(node scripts/cms/indexar.mjs | $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt); echo "$out"
          echo "$out" | grep -q " 0 nuevas · 0 cambiadas · 0 fijas · "
          test "$(Q "select count(*) from cms_string_versions")" = "$n1"
          if err=$(Q "update cms_strings set text = jsonb_build_object('es', 'x', 'en', 'y') where locked and id = (select id from cms_strings where locked limit 1)" 2>&1); then echo "✗ se editó una línea fija"; exit 1; fi
          echo "$err" | grep -q "cms_linea_fija"
          if err=$(Q "update cms_strings set text = jsonb_build_object('es', 'x', 'en', 'y') where id = 'APP-HOME.hoy'" 2>&1); then echo "✗ se editó una cadena sin autor"; exit 1; fi
          echo "$err" | grep -q "cms_sin_autor"
      - name: La semilla del sandbox se puede volver a aplicar con el sandbox ya usado
        # Guardián (5 nov): la semilla borraba fotos que un «Reportar foto» ya referenciaba y fallaba. Se aplica, se
        # simula uso real (reporte de foto, guardado, lista de espera) y se vuelve a aplicar con la semilla cambiada.
        env: { POSTGRES_PASSWORD: ci, TOLATINO_COMMIT: ci }
        run: |
          C="docker compose -p ci -f infra/pruebas/docker-compose.yml"
          Q() { $C exec -T db psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U tolatino -d tolatino -qAt -c "$1"; }
          SEMILLA_DIR=infra/pruebas/semilla bash packages/db/migrar.sh --semilla-pruebas $C
          Q "insert into users (phone, first_name, last_name) values ('+15705550198', 'CI', 'Prueba') on conflict do nothing"
          U=$(Q "select id from users where phone = '+15705550198'")
          Q "insert into photo_reports (media_id, reporter_user_id, reason) select id, '$U', 'otro' from media where status = 'visible' order by id limit 3"
          Q "insert into favorites (user_id, kind, target_id) select '$U', 'business', id from businesses limit 3"
          Q "insert into city_waitlist (city_id, user_id, source) values ('alw', '$U', 'coming_soon')"
          Q "update schema_seeds set sha256 = 'cambiada' where name like 'pruebas/%'"
          SEMILLA_DIR=infra/pruebas/semilla bash packages/db/migrar.sh --semilla-pruebas $C
          test "$(Q "select count(*) from photo_reports")" = "3"
          test "$(Q "select count(*) from media where status = 'visible'")" -gt 1000

  seguridad:
    name: seguridad · Semgrep (reglas propias) · dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependencias (nada alto ni crítico)
        run: pnpm audit --audit-level high
      - name: Semgrep con las reglas de semgrep/ (SQL armado con texto, HTML crudo, procesos con texto, secretos)
        run: |
          python3 -m venv "$RUNNER_TEMP/sg" && "$RUNNER_TEMP/sg/bin/pip" install -q semgrep==1.185.0
          # 9t · La prueba de las reglas (semgrep/tolatino.ts): lo que tienen que cazar sale y lo que no, no. Una regla que deja de ver algo falla aquí.
          "$RUNNER_TEMP/sg/bin/semgrep" --test --metrics=off --disable-version-check semgrep/
          "$RUNNER_TEMP/sg/bin/semgrep" scan --config semgrep/ --error --metrics=off --disable-version-check --json-output="$RUNNER_TEMP/semgrep.json" apps packages services scripts
          # 9t · Lo que Semgrep no pudo leer (un tipo o una expresión que su lector no entiende) no lo revisó: cuenta como rojo, no como limpio.
          node -e 'const e = require(process.argv[1]).errors ?? []; for (const x of e) console.error([].concat(x.type)[0], x.path ?? "", String(x.message ?? "").slice(0, 300)); if (e.length) { console.error(`Semgrep no pudo leer ${e.length} parte(s): lo que no lee no lo revisa.`); process.exit(1); }' "$RUNNER_TEMP/semgrep.json"

  web:
    name: web · build una vez para todos los grupos
    needs: cambios
    if: ${{ needs.cambios.outputs.alcance != 'documentos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tolatino/web build
      - name: Empaquetar con tar (conserva los enlaces de pnpm; sin la caché del build)
        run: |
          cd apps/web && cp -r .next/static .next/standalone/apps/web/.next/ && cp -r public .next/standalone/apps/web/
          cd ../.. && tar czf "$RUNNER_TEMP/web.tgz" --exclude='apps/web/.next/cache' apps/web/.next
      - uses: actions/upload-artifact@v4
        with: { name: web, path: "${{ runner.temp }}/web.tgz", retention-days: 1, compression-level: 0 }

  # Dos carriles: las pruebas al revés (tocan archivos del repo y corren los guardianes) y TODA la punta a punta en una sola base y en el orden de
  # las fases, UNA a la vez. No se reparte por grupos: las pruebas se heredan datos (las de la fase 4 dependen de las de la 2, com5g del plan que deja
  # free2b…); repartidas en trabajos con base propia fallaron 30 de 199 en la primera corrida (13 nov) por eso, no por la app.
  regresion:
    name: punta a punta · ${{ matrix.nombre }}${{ (inputs.partes || '4') != '1' && format(' · {0}/{1}', matrix.parte, inputs.partes || '4') || '' }}
    needs: [cambios, web]
    if: ${{ needs.cambios.outputs.alcance != 'documentos' && (inputs.alcance || 'todo') != 'pantallas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 20 nov · Los textos de las pruebas al revés ya se comprobaron en «tipos · build · guardianes» (alrevesConSuTexto): aquí no se repiten al
    # final de cada una de las ~100 pruebas al revés (serían 8 s más por prueba).
    env: { GUARDIANES_SIN_TEXTOS: "1" }
    # 20 nov · Cada carril se reparte en `partes` trabajos (por posición, el mismo reparto en cada corrida), cada uno con su base
    # nueva. Exige que cada prueba prepare sus propios datos (precondicionPropia). Por defecto 4 (también en push y programado); 1 = un solo trabajo.
    strategy:
      fail-fast: false
      matrix:
        # Con confirmar=si (y sin «solo»), «todas las fases» sería repetir la primera pasada de «confirmación · dos veces seguidas» (el mismo
        # comando en base nueva): corre una sola vez, allá. Sin confirmar, corre aquí como siempre.
        nombre: ${{ fromJSON((inputs.confirmar == 'si' && inputs.solo == '') && '["al revés"]' || '["al revés","todas las fases"]') }}
        parte: ${{ fromJSON((inputs.partes || '4') == '4' && '[1,2,3,4]' || '[1]') }}
    steps:
      # Historia completa: las pruebas al revés de 8a leen versiones viejas de archivos con «git show <sha>».
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/entorno-pruebas
      # alreves9o arma sobres de verdad (age-keygen) para el caso del sobre que no es para su servidor. También cuando una dirigida
      # (solo=…) nombra pruebas al revés: corren en este carril (19 nov: alreves9o falló sin age en «todas las fases»).
      - name: age para las pruebas al revés de 9o
        if: ${{ matrix.nombre == 'al revés' || contains(inputs.solo, 'alreves') }}
        run: sudo apt-get install -y -q age >/dev/null
      - name: Regresión de ${{ matrix.nombre }} en base nueva
        run: node pruebas/correr.mjs ${{ (inputs.solo != '' && matrix.nombre != 'al revés') && inputs.solo || (matrix.nombre == 'al revés' && '--grupo alreves' || '--grupo fase1,fase2,fase3,fase4,fase5,fase6,fase7,fase8,fase9,varios') }} --parte ${{ matrix.parte }}/${{ inputs.partes || '4' }} --reintentar
      - name: Subidas que llegaron sin archivo (si hubo; el servidor dice qué recibió)
        if: always()
        run: grep -h "\[subida\]" "$RUNNER_TEMP/salida/server.log" 2>/dev/null | tail -n 20 | cut -c1-300 || true
      - name: Lo último que dijo el servidor (solo si algo cayó)
        if: failure()
        # 21 nov · Además de la cola, los errores de servidor de toda la corrida, una vez cada uno (la cola sola quedó tapada por un error repetido
        # y no se veía la excepción que tumbó a ciu9i: CI 44866551623).
        run: |
          L="$RUNNER_TEMP/salida/server.log"
          echo "--- errores del servidor (cada uno una vez, con cuántas veces salió):"
          grep -aE '^(\s*⨯|Error:|\[?[A-Za-z]*Error\b|error: )|digest: ' "$L" 2>/dev/null | cut -c1-400 | sort | uniq -c | sort -rn | head -40 || true
          echo "--- la cola del registro:"
          tail -n 150 "$L" 2>/dev/null | cut -c1-600 || true
      - name: Lo que dejó cada prueba (sin secretos, solo res y el registro del servidor)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/subir" && cp -r "$RUNNER_TEMP/salida/res" "$RUNNER_TEMP/subir/res" 2>/dev/null || true
          cp "$RUNNER_TEMP/salida/server.log" "$RUNNER_TEMP/subir/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "regresion-${{ strategy.job-index }}", path: "${{ runner.temp }}/subir", retention-days: 7, if-no-files-found: ignore }

  # La confirmación de 9b-1 (solo a mano, confirmar=si): toda la punta a punta DOS veces seguidas sobre la misma base (lo que una corrida no limpia) y,
  # en otra base, una vez barajada (lo que depende del orden). Cada una en su trabajo: juntas pasarían de las 6 horas que da GitHub.
  confirmacion:
    name: confirmación · ${{ matrix.nombre }}${{ (inputs.partes || '4') != '1' && format(' · {0}/{1}', matrix.parte, inputs.partes || '4') || '' }}
    needs: web
    if: ${{ inputs.confirmar == 'si' && (inputs.alcance || 'todo') != 'pantallas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        nombre: ["dos veces seguidas", "barajada"]
        parte: ${{ fromJSON((inputs.partes || '4') == '4' && '[1,2,3,4]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/entorno-pruebas
      - name: Primera pasada
        run: node pruebas/correr.mjs --grupo fase1,fase2,fase3,fase4,fase5,fase6,fase7,fase8,fase9,varios ${{ matrix.nombre == 'barajada' && format('--barajar {0}', inputs.semilla) || '' }} --parte ${{ matrix.parte }}/${{ inputs.partes || '4' }} --reintentar
      - name: Segunda pasada, en la MISMA base
        if: ${{ matrix.nombre == 'dos veces seguidas' }}
        run: node pruebas/correr.mjs --grupo fase1,fase2,fase3,fase4,fase5,fase6,fase7,fase8,fase9,varios --parte ${{ matrix.parte }}/${{ inputs.partes || '4' }} --reintentar
      - name: Subidas que llegaron sin archivo (si hubo; el servidor dice qué recibió)
        if: always()
        run: grep -h "\[subida\]" "$RUNNER_TEMP/salida/server.log" 2>/dev/null | tail -n 20 | cut -c1-300 || true
      - name: Lo último que dijo el servidor (solo si algo cayó)
        if: failure()
        # 21 nov · Además de la cola, los errores de servidor de toda la corrida, una vez cada uno (la cola sola quedó tapada por un error repetido
        # y no se veía la excepción que tumbó a ciu9i: CI 44866551623).
        run: |
          L="$RUNNER_TEMP/salida/server.log"
          echo "--- errores del servidor (cada uno una vez, con cuántas veces salió):"
          grep -aE '^(\s*⨯|Error:|\[?[A-Za-z]*Error\b|error: )|digest: ' "$L" 2>/dev/null | cut -c1-400 | sort | uniq -c | sort -rn | head -40 || true
          echo "--- la cola del registro:"
          tail -n 150 "$L" 2>/dev/null | cut -c1-600 || true
      - name: Lo que dejó cada prueba
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/subir" && cp -r "$RUNNER_TEMP/salida/res" "$RUNNER_TEMP/subir/res" 2>/dev/null || true
          cp "$RUNNER_TEMP/salida/server.log" "$RUNNER_TEMP/subir/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "confirmacion-${{ strategy.job-index }}", path: "${{ runner.temp }}/subir", retention-days: 7, if-no-files-found: ignore }

  dispositivos:
    name: dispositivo · ${{ matrix.id }}
    needs: [cambios, web]
    if: ${{ needs.cambios.outputs.alcance != 'documentos' && (inputs.alcance || 'todo') != 'regresion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        id: [iphone-se, iphone-15, iphone-15-pro-max, pixel, galaxy, ipad, escritorio-1024, escritorio-1280, escritorio-1440]
        include:
          # La velocidad (LCP y TBT) solo se mide en Chromium: un teléfono (Pixel) y un escritorio (1280).
          - { id: pixel, velocidad: true }
          - { id: escritorio-1280, velocidad: true }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/entorno-pruebas
      - name: Punta a punta en el dispositivo (disp9b)
        run: node pruebas/correr.mjs disp9b --dispositivo ${{ matrix.id }}
      - name: Capturas contra las aprobadas y axe (WCAG AA)
        if: ${{ always() && inputs.aprobar != 'si' }}
        run: node pruebas/visual/correr.mjs --dispositivo ${{ matrix.id }}
      - name: Capturas NUEVAS (se aprueban en docs/REVISION.md y entran por commit)
        if: ${{ always() && inputs.aprobar == 'si' }}
        run: node pruebas/visual/correr.mjs --dispositivo ${{ matrix.id }} --aprobar
      - name: Velocidad (Web Vitals de laboratorio contra pruebas/velocidad/presupuesto.json)
        if: ${{ always() && matrix.velocidad }}
        run: node pruebas/visual/correr.mjs --dispositivo ${{ matrix.id }} --velocidad ${{ inputs.medir == 'si' && '--medir' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "pantallas-${{ matrix.id }}", path: "${{ runner.temp }}/salida/visual/${{ matrix.id }}", retention-days: 7, if-no-files-found: ignore }
      - name: Las capturas aprobadas también al registro (base64), para quien no pueda bajar artefactos
        if: ${{ always() && inputs.aprobar == 'si' }}
        run: |
          for f in pruebas/visual/*/${{ matrix.id }}.png; do echo "PNG-APROBADA $f"; base64 -w0 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.aprobar == 'si' }}
        with: { name: "visual-aprobadas-${{ matrix.id }}", path: "pruebas/visual/*/${{ matrix.id }}.png", retention-days: 14, if-no-files-found: error }

  # 9c · La punta a punta entera en los anchos extremos (LAUNCH L1511): 141 de las ~200 pruebas abren teléfono y escritorio, así que «las que
  # dependen del ancho» son casi todas. En vez de elegir, la regresión completa corre de noche (programado) en el teléfono más chico (iPhone SE,
  # 375), la tableta (iPad, 820) y el escritorio más angosto (1024); los anchos de en medio los cubren la regresión de siempre (390 y 1360) y
  # disp9b + capturas + axe en los 9. El repo es público: el CI no cuesta minutos. A mano: anchos=si.
  anchos:
    name: punta a punta · ancho ${{ matrix.id }}${{ (inputs.partes || '4') != '1' && format(' · {0}/{1}', matrix.parte, inputs.partes || '4') || '' }}
    needs: web
    if: ${{ github.event_name == 'schedule' || inputs.anchos == 'si' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        id: [iphone-se, ipad, escritorio-1024]
        parte: ${{ fromJSON((inputs.partes || '4') == '4' && '[1,2,3,4]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/entorno-pruebas
      - name: age (una dirigida que nombra pruebas al revés las corre también aquí)
        if: ${{ contains(inputs.solo, 'alreves') }}
        run: sudo apt-get install -y -q age >/dev/null
      - name: Toda la punta a punta en ${{ matrix.id }}, en base nueva
        run: node pruebas/correr.mjs ${{ inputs.solo != '' && inputs.solo || '--grupo fase1,fase2,fase3,fase4,fase5,fase6,fase7,fase8,fase9,varios' }} --dispositivo ${{ matrix.id }} --parte ${{ matrix.parte }}/${{ inputs.partes || '4' }} --reintentar
      - name: Subidas que llegaron sin archivo (si hubo; el servidor dice qué recibió)
        if: always()
        run: grep -h "\[subida\]" "$RUNNER_TEMP/salida/server.log" 2>/dev/null | tail -n 20 | cut -c1-300 || true
      - name: Lo último que dijo el servidor (solo si algo cayó)
        if: failure()
        # 21 nov · Además de la cola, los errores de servidor de toda la corrida, una vez cada uno (la cola sola quedó tapada por un error repetido
        # y no se veía la excepción que tumbó a ciu9i: CI 44866551623).
        run: |
          L="$RUNNER_TEMP/salida/server.log"
          echo "--- errores del servidor (cada uno una vez, con cuántas veces salió):"
          grep -aE '^(\s*⨯|Error:|\[?[A-Za-z]*Error\b|error: )|digest: ' "$L" 2>/dev/null | cut -c1-400 | sort | uniq -c | sort -rn | head -40 || true
          echo "--- la cola del registro:"
          tail -n 150 "$L" 2>/dev/null | cut -c1-600 || true
      - name: Lo que dejó cada prueba
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/subir" && cp -r "$RUNNER_TEMP/salida/res" "$RUNNER_TEMP/subir/res" 2>/dev/null || true
          cp "$RUNNER_TEMP/salida/server.log" "$RUNNER_TEMP/subir/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "anchos-${{ matrix.id }}-${{ matrix.parte }}", path: "${{ runner.temp }}/subir", retention-days: 7, if-no-files-found: ignore }

  tuberia:
    name: la tubería completa (todo en verde, nada saltado)
    needs: [cambios, verificar, seguridad, regresion, dispositivos, confirmacion, anchos]
    if: always()
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    steps:
      # Decisión AG (20 nov): más de 3 inestables en una corrida = roja. El tope de pruebas/correr.mjs es por proceso y la corrida va repartida en
      # partes: la confirmación 44856657972 salió verde con 4 inestables (una por parte). Aquí se cuentan las de TODA la corrida, por nombre de prueba.
      # 22 nov · Se cuentan desde lo que cada carril SUBE (res/inestables.json, que pruebas/correr.mjs escribe siempre), no desde su registro: el
      # registro de un trabajo no se deja leer desde dentro de la corrida (44961847914: 22 de 22 sin leer), y antes eso se callaba y salía «0»
      # (44947348390 dijo 0 con una). Un carril que terminó en verde y no trae su lista no cuenta como cero: la tubería sale roja diciéndolo.
      - uses: actions/download-artifact@v4
        with: { pattern: "regresion-*", path: "${{ runner.temp }}/listas" }
      - uses: actions/download-artifact@v4
        with: { pattern: "confirmacion-*", path: "${{ runner.temp }}/listas" }
      - uses: actions/download-artifact@v4
        with: { pattern: "anchos-*", path: "${{ runner.temp }}/listas" }
      - name: Inestables de toda la corrida (más de 3 = roja)
        env: { GH_TOKEN: "${{ github.token }}", CORRIDA: "${{ github.run_id }}", INTENTO: "${{ github.run_attempt }}", REPO: "${{ github.repository }}" }
        run: |
          export LC_ALL=C.UTF-8
          mkdir -p "$RUNNER_TEMP/listas"
          esperadas=$(gh api "repos/$REPO/actions/runs/$CORRIDA/attempts/$INTENTO/jobs" --paginate -q '.jobs[] | select(.conclusion == "success") | select(.name | test("^(punta a punta|confirmación) ")) | .id' | grep -c . || true)
          halladas=$(find "$RUNNER_TEMP/listas" -path '*/res/inestables.json' | grep -c . || true)
          if [ "$halladas" -lt "$esperadas" ]; then echo "::error::faltan listas de inestables: $halladas de $esperadas carriles en verde subieron la suya; no se pueden contar y no se dan por cero"; exit 1; fi
          find "$RUNNER_TEMP/listas" -path '*/res/inestables.json' -print0 | xargs -0 -r node -e 'const fs = require("fs"); for (const f of process.argv.slice(1)) for (const x of JSON.parse(fs.readFileSync(f, "utf8"))) console.log(x.nombre);' > "$RUNNER_TEMP/inestables.txt"
          sort -u "$RUNNER_TEMP/inestables.txt" > "$RUNNER_TEMP/inestables-unicas.txt"
          n=$(grep -c . "$RUNNER_TEMP/inestables-unicas.txt" || true)
          echo "inestables de la corrida: $n (de $halladas listas)$( [ "$n" -gt 0 ] && echo " · $(paste -sd' ' "$RUNNER_TEMP/inestables-unicas.txt")")"
          if [ "$n" -gt 3 ]; then echo "::error::$n pruebas inestables en la corrida (más de 3 = roja, decisión AG): $(paste -sd' ' "$RUNNER_TEMP/inestables-unicas.txt")"; exit 1; fi
      # 22 nov · En un push de solo documentos (lo decide «cambios»), regresión y dispositivos se saltan por diseño y se dice con todas las letras.
      - name: Cada parte terminó en verde (una parte saltada cuenta como roja, salvo en una corrida parcial a mano o un push de solo documentos)
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          SOLO_DOCUMENTOS: ${{ github.event_name == 'push' && needs.cambios.outputs.alcance == 'documentos' && 'si' || 'no' }}
          N_DOCUMENTOS: ${{ needs.cambios.outputs.n }}
          ALCANCE: ${{ inputs.alcance || 'todo' }}
          CONFIRMAR: ${{ inputs.confirmar }}
          ANCHOS: ${{ (github.event_name == 'schedule' || inputs.anchos == 'si') && 'si' || 'no' }}
        run: |
          echo "$RESULTADOS" | node -e '
            const n = JSON.parse(require("fs").readFileSync(0, "utf8")), a = process.env.ALCANCE; let mal = 0;
            const docs = process.env.SOLO_DOCUMENTOS === "si";
            if (docs) { const m = "solo documentos: " + process.env.N_DOCUMENTOS + " archivos; los carriles largos no corren por diseño"; console.log(m); console.log("::notice::" + m); }
            for (const [k, v] of Object.entries(n)) {
              const porDocs = docs && (k === "regresion" || k === "dispositivos");
              const parcial = (a === "pantallas" && k === "regresion") || (a === "regresion" && k === "dispositivos") || (k === "confirmacion" && process.env.CONFIRMAR !== "si") || (k === "anchos" && process.env.ANCHOS !== "si") || porDocs;
              const ok = v.result === "success" || (v.result === "skipped" && parcial);
              console.log((ok ? "✓ " : "✗ ") + k + " · " + v.result + (v.result === "skipped" && parcial ? (porDocs ? " (a propósito: solo documentos)" : " (a propósito: alcance " + a + ")") : ""));
              if (!ok) mal++;
            }
            if (mal) process.exit(1);
          '
