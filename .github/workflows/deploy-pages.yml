name: Deploy web to GitHub Pages

# Builds the Next.js app (apps/web) as a static export and publishes it to
# GitHub Pages — a free, shareable live preview at
# https://devpayxer.github.io/tolatino/
# (Production hosting target remains Cloudflare Pages.)

# Manual-only for now: the Pages backend was cancelling deployments
# (2026-07-02), so the live preview moved to Vercel (deploy-vercel.yml).
# Re-enable the push trigger if Pages is wanted again as a mirror.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field —
        # don't also pass `version` here (pnpm rejects the duplicate).
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        # Pages must be enabled once by hand (Settings → Pages → Source:
        # "GitHub Actions"). GitHub does not let the Actions token create the
        # Pages site itself. After that one-time toggle, deploys are automatic.
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
        run: pnpm --filter @tolatino/web build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
