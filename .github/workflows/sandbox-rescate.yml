# 26 nov · Rescate del SANDBOX (tolatino-pruebas-1) cuando dejó de actualizarse y no se arregla solo (docs/incidentes/sandbox-no-se-actualiza.md), SIN
# perder la base. Dos modos (input «modo»); el disco lo toca en los dos el mismo script, infra/pruebas/rescate-disco.sh (diagnóstico, borra SOLO los *.lock
# de /opt/tolatino/.git e instala el tolatino-sync del repo si el instalado es el de antes del 26 nov; nada más).
# · «llave» (por defecto): SIN token en GitHub. El runner genera una llave ed25519 de un solo uso (la privada nunca sale de $RUNNER_TEMP: ni al registro,
#   ni a un artefacto, ni a git), publica SOLO la pública en la rama rescate-llave y espera hasta 25 min a que el rescate conteste con ella. La API la
#   maneja Claude desde su sesión (el proxy pone el token del proyecto de pruebas): sube la llave, activa el rescate con ella y reinicia; el runner
#   diagnostica, escribe «hecho» en la rama y Claude quita el rescate y arranca normal. La rama se borra siempre (if: always()).
# · «api»: todo por el runner con el secreto HCLOUD_TOKEN del entorno «ensayo»: (a) acciones recientes; (b) rescate y reinicio; (c) esperar al rescate;
#   (d) el script de disco; (e) quitar el rescate, arrancar normal y esperar a que /api/salud sirva «pruebas». La contraseña de root del rescate es de un
#   solo uso: se enmascara (::add-mask::) antes de nada, vive en un archivo 0600 y NUNCA se imprime (sshpass la lee de SSHPASS). Pase lo que pase, el
#   último paso (if: always()) quita el rescate y arranca normal si quedó a medias.
# Solo el sandbox (174559637 · tolatino-pruebas-1 · 2.31.196.167). Nunca producción. Guardián: sandboxSeArreglaSolo (al revés: alrevesDespliegue).
name: Rescate del sandbox
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe RESCATAR: el sandbox se reinicia en modo rescate y se corta unos minutos"
        required: true
        type: string
      modo:
        description: "llave = sin token en GitHub (Claude maneja la API); api = todo aquí con HCLOUD_TOKEN del entorno «ensayo»"
        required: true
        type: choice
        options: [llave, api]
        default: llave
permissions:
  contents: read
concurrency:
  group: sandbox-rescate
  cancel-in-progress: false
jobs:
  # Modo «api»: todo aquí, con el token del proyecto de pruebas (entorno «ensayo»).
  rescate-api:
    if: inputs.modo == 'api'
    runs-on: ubuntu-latest
    environment: ensayo
    # Tope del trabajo; cada paso lleva el suyo para que el de vuelta (if: always()) siempre tenga tiempo.
    timeout-minutes: 40
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVIDOR: "174559637"
      NOMBRE: tolatino-pruebas-1
      IP: 2.31.196.167
    steps:
      - name: Confirmación
        env: { CONFIRMAR: "${{ inputs.confirmar }}" }
        run: |
          set -euo pipefail
          [ "$CONFIRMAR" = RESCATAR ] || { echo "::error::Escribe RESCATAR en «confirmar» para seguir (no se tocó nada)"; exit 1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "::error::Falta el secreto HCLOUD_TOKEN en el entorno «ensayo» (no se tocó nada)"; exit 1; }
      - uses: actions/checkout@v4
      - name: Herramientas y funciones
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get install -y -q sshpass > /dev/null
          # Las funciones de todos los pasos. hapi (scripts/produccion/hetzner.sh): el token va por una cabecera desde un archivo 0600, nunca en la línea.
          cat > "$RUNNER_TEMP/rescate-lib.sh" <<'EOF'
          . "$GITHUB_WORKSPACE/scripts/produccion/hetzner.sh"
          PWF="$RUNNER_TEMP/rescate.pw"
          # accion NOMBRE [JSON]: lanza la acción sobre el servidor y espera a que termine (tope 5 min).
          accion() {
            local id st _
            id=$(hapi POST "/servers/$SERVIDOR/actions/$1" "${2:-}" | jq_ "d['action']['id']")
            for _ in $(seq 1 60); do
              st=$(hapi GET "/actions/$id" | jq_ "d['action']['status']")
              [ "$st" = success ] && { echo "  $1: hecho"; return 0; }
              [ "$st" = error ] && { echo "  $1: la API dice error"; return 1; }
              sleep 5
            done
            echo "  $1: sin terminar en 5 min"; return 1
          }
          servidor() { hapi GET "/servers/$SERVIDOR" | jq_ "$1"; }
          # rescate ORDEN…: por SSH al sistema de rescate (solo a él: su llave de máquina es nueva cada vez, por eso no se guarda ni se comprueba).
          rescate() {
            SSHPASS=$(cat "$PWF") sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10 \
              -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 "root@$IP" "$@"
          }
          # esperar_rescate SEGUNDOS: 0 cuando el rescate contesta por SSH con la contraseña de un solo uso.
          esperar_rescate() {
            local fin=$((SECONDS + $1))
            while [ "$SECONDS" -lt "$fin" ]; do rescate true 2>/dev/null && return 0; sleep 10; done
            return 1
          }
          EOF

      - name: (a) Acciones recientes del servidor
        timeout-minutes: 2
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          # Antes de tocar nada: el servidor del token es el sandbox (su nombre y su IP).
          N=$(servidor "d['server']['name']"); I=$(servidor "d['server']['public_net']['ipv4']['ip']")
          [ "$N" = "$NOMBRE" ] && [ "$I" = "$IP" ] || { echo "::error::El servidor $SERVIDOR es «$N» ($I), no el sandbox: no se toca"; exit 1; }
          echo "servidor $SERVIDOR · $N · $I · estado $(servidor "d['server']['status']") · rescate activado: $(servidor "d['server']['rescue_enabled']")"
          echo "firewalls del proveedor: $(servidor "[f['id'] for f in d['server']['public_net'].get('firewalls', [])]") (el rescate necesita el puerto 22 abierto)"
          echo "Acciones de la API (UTC; 04:30 EST = 09:30 UTC). Un reinicio desde dentro del sistema (unattended-upgrades) NO sale aquí: lo dice el paso (d)."
          hapi GET "/servers/$SERVIDOR/actions?sort=started:desc&per_page=25" | python3 -c '
          import json, sys
          for a in json.load(sys.stdin)["actions"]:
              print(" ", a["started"], a["command"], a["status"], "fin:", a.get("finished") or "-")'

      - name: (b) Modo rescate y reinicio
        timeout-minutes: 3
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          touch "$RUNNER_TEMP/tocado"
          R=$(hapi POST "/servers/$SERVIDOR/actions/enable_rescue" '{"type":"linux64"}')
          # La contraseña de un solo uso: enmascarada ANTES de cualquier otra cosa, a un archivo 0600 y fuera de las variables. Nunca se imprime.
          PW=$(printf '%s' "$R" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("root_password") or "")')
          [ -n "$PW" ] || { echo "::error::La API no devolvió la contraseña del rescate"; exit 1; }
          echo "::add-mask::$PW"
          ( umask 077; printf '%s' "$PW" > "$PWF" )
          unset PW
          ID=$(printf '%s' "$R" | jq_ "d['action']['id']"); unset R
          for _ in $(seq 1 36); do
            st=$(hapi GET "/actions/$ID" | jq_ "d['action']['status']")
            [ "$st" = success ] && break
            [ "$st" = error ] && { echo "::error::enable_rescue: la API dice error"; exit 1; }
            sleep 5
          done
          [ "$st" = success ] || { echo "::error::enable_rescue sin terminar en 3 min"; exit 1; }
          echo "  enable_rescue: hecho"
          # Reinicio amable (ACPI): el sistema se apaga en orden (la base cierra limpia). Si no llega al rescate, el paso (c) lo fuerza.
          touch "$RUNNER_TEMP/reiniciado"
          accion reboot

      - name: (c) Esperar a que el rescate conteste
        timeout-minutes: 11
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          sleep 20
          if ! esperar_rescate 300; then
            st=$(servidor "d['server']['status']")
            echo "el rescate no contesta en 5 min (estado: $st): se fuerza"
            if [ "$st" = off ]; then accion poweron; else accion reset; fi
            esperar_rescate 300 || { echo "::error::El rescate no contesta por SSH en 10 min (¿puerto 22 cerrado por un firewall?)"; exit 1; }
          fi
          # Que de verdad es el rescate (su raíz vive en memoria, no en el disco del servidor).
          # shellcheck disable=SC2016  # (comillas simples a propósito: se expande allá, en el rescate)
          rescate 'echo "rescate: $(hostname) · raíz: $(findmnt -n -o SOURCE /)"; ! findmnt -n -o SOURCE / | grep -q "^/dev/[sv]d"' \
            || { echo "::error::Lo que contesta no es el sistema de rescate"; exit 1; }

      - name: (d) Diagnóstico, candados de git y tolatino-sync
        timeout-minutes: 10
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          # El mismo script que el modo llave (infra/pruebas/rescate-disco.sh); el script y el tolatino-sync del repo van antes a /tmp del rescate (sin stdin: nada se come el script).
          rescate 'cat > /tmp/tolatino-sync.nuevo' < infra/pruebas/tolatino-sync
          rescate 'cat > /tmp/rescate-disco.sh' < infra/pruebas/rescate-disco.sh
          rescate 'bash /tmp/rescate-disco.sh /tmp/tolatino-sync.nuevo < /dev/null'

      - name: (e) Arrancar normal y esperar a que sirva el commit de pruebas
        timeout-minutes: 13
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          # Hetzner quita la marca de rescate él solo al arrancar en él: disable_rescue solo si sigue puesta.
          if [ "$(servidor "d['server']['rescue_enabled']")" = True ]; then accion disable_rescue; else echo "  disable_rescue: Hetzner ya la quitó al arrancar el rescate"; fi
          # El disco ya está desmontado y sincronizado y el rescate vive en memoria: el reinicio en frío es seguro y no depende de ACPI en el rescate.
          accion reset
          touch "$RUNNER_TEMP/normal"
          PRUEBAS=$(git ls-remote origin refs/heads/pruebas | cut -f1)
          echo "la rama pruebas está en ${PRUEBAS:0:12}; se espera hasta 10 min a que /api/salud la sirva"
          t0=$SECONDS; SERVIDO=""; ok=0
          while [ $((SECONDS - t0)) -lt 600 ]; do
            S=$(curl -s -m 10 "http://$IP/api/salud" | python3 -c 'import json, sys
          try: print(json.load(sys.stdin).get("commit", ""))
          except Exception: print("")' || true)
            if [ -n "$S" ] && [ "$S" != "$SERVIDO" ]; then echo "  a los $((SECONDS - t0)) s /api/salud sirve el commit $S"; SERVIDO=$S; fi
            if [ -n "$S" ] && [ "${PRUEBAS#"$S"}" != "$PRUEBAS" ]; then ok=1; break; fi
            sleep 15
          done
          echo "== /estado/ (últimas líneas)"; curl -s -m 30 "http://$IP/estado/" | sed -e 's/<[^>]*>//g' | grep -v '^\s*$' | tail -n 30 || true
          echo "== /api/salud"; curl -s -m 30 "http://$IP/api/salud" | head -c 600 || true; echo
          if [ "$ok" = 1 ]; then echo "listo: el sandbox sirve ${SERVIDO} (pruebas)"; else
            echo "::error::A los 10 min /api/salud sirve «${SERVIDO:-nada}», no ${PRUEBAS:0:12}. Si /estado/ dice «deploy.sh inicio», se está desplegando: míralo con «Estado del sandbox» en unos minutos."
            exit 1
          fi

      # Pase lo que pase: el servidor nunca se queda en rescate ni apagado.
      - name: Vuelta a normal si quedó a medias
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/tocado" ] || { echo "no se llegó a tocar el servidor"; exit 0; }
          . "$RUNNER_TEMP/rescate-lib.sh"
          R=$(servidor "d['server']['rescue_enabled']"); ST=$(servidor "d['server']['status']")
          echo "rescate activado: $R · estado: $ST"
          if [ "$R" = True ]; then
            [ -f "$PWF" ] && { rescate 'sync; umount /mnt/tl 2>/dev/null; true' 2>/dev/null || true; }
            accion disable_rescue
          fi
          if [ "$ST" = off ]; then accion poweron
          elif [ -f "$RUNNER_TEMP/reiniciado" ] && [ ! -f "$RUNNER_TEMP/normal" ]; then accion reset
          else echo "nada que deshacer"; fi
          rm -f "$PWF"

  # Modo «llave» (por defecto): sin HCLOUD_TOKEN ni el entorno «ensayo». El runner tiene el SSH; Claude, la API (docs/incidentes/sandbox-no-se-actualiza.md).
  rescate-llave:
    if: inputs.modo == 'llave'
    runs-on: ubuntu-latest
    # Solo este trabajo escribe en el repo: la rama rescate-llave (la pública y «hecho»), que se borra siempre al final.
    permissions:
      contents: write
    timeout-minutes: 55
    env:
      IP: 2.31.196.167
      RAMA: rescate-llave
      GIT_AUTHOR_NAME: rescate del sandbox
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: rescate del sandbox
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Confirmación
        env: { CONFIRMAR: "${{ inputs.confirmar }}" }
        run: |
          set -euo pipefail
          [ "$CONFIRMAR" = RESCATAR ] || { echo "::error::Escribe RESCATAR en «confirmar» para seguir (no se tocó nada)"; exit 1; }
      - uses: actions/checkout@v4
      - name: (a) Llave de un solo uso y su pública en la rama rescate-llave
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # La privada vive SOLO en $RUNNER_TEMP/llave (0700, fuera del checkout): nunca se imprime, ni va a git, ni a un artefacto.
          ( umask 077; mkdir -p "$RUNNER_TEMP/llave" "$RUNNER_TEMP/publica" )
          ssh-keygen -q -t ed25519 -N '' -C "rescate-$GITHUB_RUN_ID" -f "$RUNNER_TEMP/llave/id"
          cp "$RUNNER_TEMP/llave/id.pub" "$RUNNER_TEMP/publica/llave.pub"
          echo "huella: $(ssh-keygen -lf "$RUNNER_TEMP/publica/llave.pub")"
          echo "pública: $(cat "$RUNNER_TEMP/publica/llave.pub")"
          # Un commit sin padre con SOLO llave.pub, armado a mano (hash-object + mktree + commit-tree): no toca el checkout ni su índice.
          BL=$(git hash-object -w "$RUNNER_TEMP/publica/llave.pub")
          T=$(printf '100644 blob %s\tllave.pub\n' "$BL" | git mktree)
          # 26 nov (primer rescate: el firewall tolatino-pruebas-web solo abre 80/443/ICMP) · La IP de salida de este runner va en el mensaje del commit
          # («ip <x>»): Claude abre el 22 SOLO para esa IP /32 mientras dura el rescate y deja el firewall como estaba al terminar.
          IP_RUNNER=$(curl -s -m 15 https://api.ipify.org || true)
          [[ "$IP_RUNNER" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::no se pudo saber la IP de este runner (hace falta para abrir el 22 solo a ella)"; exit 1; }
          echo "IP de este runner: $IP_RUNNER"
          C=$(git commit-tree "$T" -m "rescate $GITHUB_RUN_ID: llave pública de un solo uso · ip $IP_RUNNER")
          git push -q --force origin "$C:refs/heads/$RAMA"
          echo "$C" > "$RUNNER_TEMP/rama-commit"
          echo "publicada en la rama $RAMA (${C:0:12}). Claude: POST /ssh_keys «rescate-$GITHUB_RUN_ID», abrir el 22 a $IP_RUNNER/32 en el firewall, enable_rescue con esa llave y reset."
          cat > "$RUNNER_TEMP/rescate-lib.sh" <<'EOF'
          # rescate ORDEN…: por SSH al sistema de rescate con la llave de esta corrida (su llave de máquina es nueva cada vez: no se guarda ni se comprueba).
          rescate() {
            ssh -i "$RUNNER_TEMP/llave/id" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -o ConnectTimeout=10 "root@$IP" "$@"
          }
          EOF

      - name: (b) Esperar a que el rescate conteste con esta llave (hasta 25 min)
        timeout-minutes: 27
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          t0=$SECONDS; dicho=-1
          until rescate true 2>/dev/null; do
            [ $((SECONDS - t0)) -lt 1500 ] || { echo "::error::A los 25 min el rescate no contesta con la llave de esta corrida. Claude: si activaste el rescate, quítalo (disable_rescue y reset) y borra la llave."; exit 1; }
            m=$(((SECONDS - t0) / 60))
            if [ "$m" != "$dicho" ]; then echo "esperando rescate ($m min)"; dicho=$m; fi
            sleep 10
          done
          echo "el rescate contesta a los $((SECONDS - t0)) s"
          # Que de verdad es el rescate (su raíz vive en memoria, no en el disco del servidor).
          # shellcheck disable=SC2016  # (comillas simples a propósito: se expande allá, en el rescate)
          rescate 'echo "rescate: $(hostname) · raíz: $(findmnt -n -o SOURCE /)"; ! findmnt -n -o SOURCE / | grep -q "^/dev/[sv]d"' \
            || { echo "::error::Lo que contesta no es el sistema de rescate: no se toca el disco"; exit 1; }

      - name: (c) Diagnóstico, candados de git y tolatino-sync
        timeout-minutes: 10
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/rescate-lib.sh"
          # El mismo script que el modo api (infra/pruebas/rescate-disco.sh); el script y el tolatino-sync del repo van antes a /tmp del rescate (sin stdin: nada se come el script).
          rescate 'cat > /tmp/tolatino-sync.nuevo' < infra/pruebas/tolatino-sync
          rescate 'cat > /tmp/rescate-disco.sh' < infra/pruebas/rescate-disco.sh
          rescate 'bash /tmp/rescate-disco.sh /tmp/tolatino-sync.nuevo < /dev/null'

      - name: (d) RESCATE-HECHO en la rama (Claude quita el rescate)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf 'RESCATE-HECHO %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/publica/hecho"
          BL=$(git hash-object -w "$RUNNER_TEMP/publica/llave.pub")
          BH=$(git hash-object -w "$RUNNER_TEMP/publica/hecho")
          T=$(printf '100644 blob %s\thecho\n100644 blob %s\tllave.pub\n' "$BH" "$BL" | git mktree)
          C=$(git commit-tree "$T" -p "$(cat "$RUNNER_TEMP/rama-commit")" -m "rescate $GITHUB_RUN_ID: RESCATE-HECHO")
          git push -q origin "$C:refs/heads/$RAMA"
          echo "RESCATE-HECHO en la rama $RAMA (${C:0:12}): el disco está desmontado. Claude: disable_rescue, reset y borrar la llave."

      - name: (e) Esperar a que el sandbox vuelva y sirva el commit de pruebas
        timeout-minutes: 17
        run: |
          set -euo pipefail
          PRUEBAS=$(git ls-remote origin refs/heads/pruebas | cut -f1)
          echo "la rama pruebas está en ${PRUEBAS:0:12}; se espera hasta 15 min a que /api/salud la sirva (Claude quita el rescate y reinicia)"
          t0=$SECONDS; SERVIDO=""; ok=0
          while [ $((SECONDS - t0)) -lt 900 ]; do
            S=$(curl -s -m 10 "http://$IP/api/salud" | python3 -c 'import json, sys
          try: print(json.load(sys.stdin).get("commit", ""))
          except Exception: print("")' || true)
            if [ -n "$S" ] && [ "$S" != "$SERVIDO" ]; then echo "  a los $((SECONDS - t0)) s /api/salud sirve el commit $S"; SERVIDO=$S; fi
            if [ -n "$S" ] && [ "${PRUEBAS#"$S"}" != "$PRUEBAS" ]; then ok=1; break; fi
            sleep 15
          done
          echo "== /estado/ (últimas líneas)"; curl -s -m 30 "http://$IP/estado/" | sed -e 's/<[^>]*>//g' | grep -v '^\s*$' | tail -n 30 || true
          echo "== /api/salud"; curl -s -m 30 "http://$IP/api/salud" | head -c 600 || true; echo
          if [ "$ok" = 1 ]; then echo "listo: el sandbox sirve ${SERVIDO} (pruebas)"; else
            echo "::error::A los 15 min /api/salud sirve «${SERVIDO:-nada}», no ${PRUEBAS:0:12}. ¿Quitó Claude el rescate? Si /estado/ dice «deploy.sh inicio», se está desplegando: míralo con «Estado del sandbox» en unos minutos."
            exit 1
          fi

      # Pase lo que pase: la llave se borra del runner y la rama rescate-llave del repo.
      - name: Borrar la rama rescate-llave y la llave
        if: always()
        timeout-minutes: 2
        env: { ESTADO: "${{ job.status }}" }
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/llave"
          git ls-remote --exit-code origin "refs/heads/$RAMA" > /dev/null 2>&1; rc=$?
          if [ "$rc" = 2 ]; then echo "la rama $RAMA no existe (nada que borrar)"
          elif [ "$rc" = 0 ] && git push -q origin --delete "$RAMA"; then echo "rama $RAMA borrada"
          else echo "::error::No se pudo borrar la rama $RAMA (ls-remote: $rc): bórrala a mano"; exit 1; fi
          [ "$ESTADO" = success ] || echo "::warning::El rescate no terminó bien: Claude, comprueba por la API que el servidor NO quedó en rescate (rescue_enabled false); si sí, disable_rescue y reset."
