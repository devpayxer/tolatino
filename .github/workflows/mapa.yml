name: Mapa · teselas propias
# Comprueba de punta a punta las teselas propias: genera Pensilvania, las sirve con tileserver-gl y pide teselas
# reales de Hazleton (raster y vectorial). Corre a mano o cuando cambia infra/mapa.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/mapa/**", ".github/workflows/mapa.yml"]

jobs:
  teselas:
    name: generar · servir · probar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generar teselas de Pensilvania
        run: |
          docker pull ghcr.io/onthegomap/planetiler@sha256:b3b48614759d8676739f341b3de028bf852bbc80a0ea70804a2c55681d235c90
          docker run --rm ghcr.io/onthegomap/planetiler@sha256:b3b48614759d8676739f341b3de028bf852bbc80a0ea70804a2c55681d235c90 --help 2>&1 | head -3 || true
          docker image inspect ghcr.io/onthegomap/planetiler@sha256:b3b48614759d8676739f341b3de028bf852bbc80a0ea70804a2c55681d235c90 --format '{{index .Config.Labels "org.opencontainers.image.version"}}' || true
          time bash infra/mapa/generar.sh "$RUNNER_TEMP/mapa"
      - name: Servir y pedir teselas de Hazleton
        run: |
          docker run -d --name teselas -p 8080:8080 -v "$RUNNER_TEMP/mapa":/data maptiler/tileserver-gl:v5.6.0 --file /data/pennsylvania.mbtiles
          for i in $(seq 1 90); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 2; done
          docker logs teselas 2>&1 | tail -20
          echo "== estilos"; curl -fsS localhost:8080/styles.json
          echo "== datos"; curl -fsS localhost:8080/data.json | head -c 600; echo
          read X15 Y15 X13 Y13 < <(python3 -c "
          import math
          def t(lat,lon,z):
            n=2**z; x=int((lon+180)/360*n); y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n); return x,y
          a=t(40.9584,-75.9746,15); b=t(40.9584,-75.9746,13); print(a[0],a[1],b[0],b[1])")
          ESTILO=$(curl -fsS localhost:8080/styles.json | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['id'])")
          for z in 15 13; do
            if [ $z = 15 ]; then X=$X15; Y=$Y15; else X=$X13; Y=$Y13; fi
            curl -fsS -o "t$z.png" "localhost:8080/styles/$ESTILO/$z/$X/$Y.png"
            file "t$z.png"; ls -la "t$z.png"
            echo "== PNG z$z base64 ini"; base64 -w0 "t$z.png"; echo; echo "== PNG z$z base64 fin"
          done
          # Vectorial (para MapLibre): la URL sale del TileJSON que publica el propio servidor.
          curl -fsS localhost:8080/data.json > data.json; cat data.json; echo
          URL=$(python3 -c "import json;print(json.load(open('data.json'))[0]['tiles'][0])")
          echo "== plantilla vectorial: $URL"
          V=$(echo "$URL" | sed "s#{z}#14#; s#{x}#$((X15/2))#; s#{y}#$((Y15/2))#; s#^https\?://[^/]*#localhost:8080#")
          curl -fsS -o v.pbf "$V"; ls -la v.pbf
          # Teselas de Hazleton a los acercamientos que usan Ciudad y Mapa (z11–13), empaquetadas para mirarlas en la
          # pantalla real fuera del sandbox (las imprime en base64; nada se publica).
          mkdir -p muestra
          python3 - <<'PY' > lista.txt
          import math
          def t(lat,lon,z):
            n=2**z; return int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          for z,r in ((11,2),(12,3),(13,3)):
            x,y=t(40.9584,-75.9746,z)
            for i in range(x-r,x+r+1):
              for j in range(y-r,y+r+1): print(z,i,j)
          PY
          while read z x y; do mkdir -p "muestra/$z/$x"; curl -fsS -o "muestra/$z/$x/$y.png" "localhost:8080/styles/$ESTILO/$z/$x/$y.png"; done < lista.txt
          tar czf muestra.tgz muestra; ls -la muestra.tgz
          echo "== MUESTRA ini"; base64 -w0 muestra.tgz; echo; echo "== MUESTRA fin"
