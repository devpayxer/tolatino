# Mira el sandbox desde fuera (el entorno de Claude no llega a la IP): respuesta de las rutas principales y la página /estado/
# con el último despliegue y las últimas líneas del registro. Solo lectura. A mano o cada 6 h.
name: Estado del sandbox
on:
  workflow_dispatch:
    inputs:
      rutas:
        description: "Rutas extra para mirar (separadas por espacio): código, tiempo y el título de la página"
        type: string
        default: ""
      cookie:
        description: "Cookie para las rutas pedidas (p. ej. tl_loc=rdg para mirar como si estuvieras en Reading)"
        type: string
        default: ""
      texto:
        description: "Texto a buscar en cada ruta pedida (dice si aparece)"
        type: string
        default: ""
      fotos:
        description: "Rutas cuyas fotos se pesan (separadas por espacio): de cada foto nuestra de la página, la original y sus 4 tamaños"
        type: string
        default: ""
      como:
        description: "Teléfono de EJEMPLO (570555xxxx) con el que se entra al sandbox para mirar las rutas de «fotos» que piden cuenta"
        type: string
        default: ""
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rutas
        run: |
          for p in / /api/salud /negocios /admin /estado/; do
            curl -s -o /dev/null -m 30 -w "$p %{http_code} %{time_total}s\n" "http://2.31.196.167$p" || echo "$p sin respuesta"
          done
      # 24 nov · La vista previa (puerto 8081): qué contesta de verdad (código, tiempo y título) y su registro entero. El fundador veía la página de
      # mantenimiento y desde el entorno de trabajo no se llega a ese puerto.
      - name: Vista previa (puerto 8081)
        run: |
          for p in / /negocios /n/barberia-el-primo; do
            h=$(curl -s -m 120 -w '\n%{http_code} %{time_total}s' "http://2.31.196.167:8081$p" || true)
            echo "8081$p $(echo "$h" | tail -1) · $(echo "$h" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//') · $(echo "$h" | grep -oE 'Estamos haciendo un cambio|La vista previa está [a-z]+|data-vista-previa' | head -1)"
          done
          echo "--- /estado/vista.txt"
          curl -s -m 30 http://2.31.196.167/estado/vista.txt | tail -45 | cut -c1-300
      - name: Rutas pedidas
        if: inputs.rutas != ''
        env: { RUTAS: "${{ inputs.rutas }}", GALLETA: "${{ inputs.cookie }}", TEXTO: "${{ inputs.texto }}" }
        run: |
          for p in $RUTAS; do
            case "$p" in /*) ;; *) echo "$p: ruta inválida"; continue ;; esac
            h=$(curl -s -m 60 ${GALLETA:+-b "$GALLETA"} -w '\n%{http_code} %{time_total}s' "http://2.31.196.167$p")
            t=""; if [ -n "$TEXTO" ]; then if printf '%s' "$h" | grep -qF -- "$TEXTO"; then t=" · «$TEXTO»: sí"; else t=" · «$TEXTO»: no"; fi; fi
            echo "$p $(echo "$h" | tail -1) · $(echo "$h" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')$t"
          done
      # 21 nov · Fotos a la medida: lo que pesa de verdad una foto subida al sandbox (la original y cada tamaño), y qué tamaño pide la página.
      - name: Fotos de las rutas pedidas
        # Con «como» las mira el trabajo «fotos» (navegador real): aquí no, para no pedir dos códigos a la vez con el mismo teléfono.
        if: inputs.fotos != '' && inputs.como == ''
        env: { RUTAS: "${{ inputs.fotos }}", GALLETA: "${{ inputs.cookie }}", COMO: "${{ inputs.como }}" }
        run: |
          B=http://2.31.196.167; J="$RUNNER_TEMP/galletas.txt"; : > "$J"
          # Solo teléfonos de ejemplo de la semilla y solo en el sandbox (el código de un uso sale en la respuesta porque está en modo pruebas).
          if [ -n "$COMO" ]; then
            case "$COMO" in 570555[0-9][0-9][0-9][0-9]) ;; *) echo "«como» solo acepta teléfonos de ejemplo 570555xxxx"; exit 1 ;; esac
            c=$(curl -s -m 30 -c "$J" -b "$J" -H "Origin: $B" -H 'content-type: application/json' -d "{\"telefono\":\"$COMO\"}" "$B/api/cuenta/codigo" | grep -oE '"codigoPrueba":"[0-9]+"' | grep -oE '[0-9]+' || true)
            if [ -z "$c" ]; then echo "no se pudo entrar: el sandbox no devolvió el código de pruebas"; else
              curl -s -o /dev/null -m 30 -c "$J" -b "$J" -H "Origin: $B" -H 'content-type: application/json' -d "{\"telefono\":\"$COMO\",\"codigo\":\"$c\"}" -w "entrar como cuenta de ejemplo: %{http_code}\n" "$B/api/cuenta/verificar"
            fi
          fi
          for p in $RUTAS; do
            case "$p" in /*) ;; *) echo "$p: ruta inválida"; continue ;; esac
            h=$(curl -s -L -m 60 -b "$J" -c "$J" ${GALLETA:+-b "$GALLETA"} -w '\n%{http_code} %{url_effective} %{size_download}' "$B$p")
            echo "== $p · $(printf '%s' "$h" | tail -1) bytes · $(printf '%s' "$h" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//') · menciones de /medios/: $(printf '%s' "$h" | grep -o '/medios/' | wc -l)"
            echo "   lo que la página pide:"
            printf '%s' "$h" | grep -oE '/medios/n/[0-9a-f-]{36}(\.w[0-9]+\.webp|\.jpg)' | sort | uniq -c | head -40
            for id in $(printf '%s' "$h" | grep -oE '/medios/n/[0-9a-f-]{36}' | sort -u | head -12); do
              echo "-- $id"
              curl -s -o /dev/null -m 30 -w "   original .jpg        %{http_code} %{content_type} %{size_download} bytes\n" "$B$id.jpg"
              for w in 320 640 1080 1600; do
                curl -s -o /dev/null -m 30 -H 'Accept: image/webp,*/*' -w "   $w webp             %{http_code} %{content_type} %{size_download} bytes\n" "$B$id.w$w.webp"
              done
              curl -s -o /dev/null -m 30 -H 'Accept: image/jpeg' -w "   640 sin WebP         %{http_code} %{content_type} %{size_download} bytes\n" "$B$id.w640.webp"
            done
          done
      - name: Página de estado
        run: curl -s -m 30 http://2.31.196.167/estado/ | sed -e 's/<[^>]*>//g' | grep -v '^\s*$' | tail -40
      - name: Salud
        run: curl -s -m 30 http://2.31.196.167/api/salud | head -c 2000; echo
      - name: Diagnóstico del último despliegue
        run: curl -s -m 30 http://2.31.196.167/estado/diag.txt | head -120
      - name: Carga de los demos (tolatino-demos)
        run: curl -s -m 30 http://2.31.196.167/estado/demos.txt | tail -45
  # 21 nov · Lo que baja un teléfono de verdad en las rutas de «fotos», entrando con la cuenta de ejemplo de «como» (navegador real).
  fotos:
    if: ${{ inputs.fotos != '' && inputs.como != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Navegador
        run: |
          npm ci --ignore-scripts --prefix pruebas/herramientas > /dev/null
          (cd pruebas/herramientas && npx playwright install --with-deps chromium > /dev/null)
      - name: Pesar las fotos
        env: { RUTAS: "${{ inputs.fotos }}", COMO: "${{ inputs.como }}", NODE_PATH: "${{ github.workspace }}/pruebas/herramientas/node_modules" }
        run: node scripts/sandbox/pesar-fotos.cjs "$COMO" $RUTAS
