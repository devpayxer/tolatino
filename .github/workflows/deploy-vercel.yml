name: Deploy to Vercel

# Deploys the app to Vercel (free live preview at tolatino.vercel.app).
# Requires the repo secret VERCEL_TOKEN (Settings → Secrets and variables →
# Actions → New repository secret). The Vercel build itself is driven by the
# root vercel.json (pnpm monorepo → apps/web static export).

on:
  push:
    branches:
      - claude/tolatino-repo-setup-1efdil
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy (production)
        env:
          VERCEL_TOKEN_RAW: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          # Sanitize: keep only the vcp_/vercel token itself, dropping any
          # stray spaces, newlines or surrounding text pasted into the secret.
          TOKEN=$(printf '%s' "$VERCEL_TOKEN_RAW" | grep -oE '[A-Za-z0-9_]{24,}' | head -1)
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN o no contiene un token válido (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx vercel@latest deploy --prod --yes --token "$TOKEN" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.log | tail -1)
          echo "### 🚀 Desplegado en Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
