name: Deploy to Vercel

# Deploys the app to Vercel (free live preview at tolatino.vercel.app).
# Requires the repo secret VERCEL_TOKEN (Settings → Secrets and variables →
# Actions → New repository secret). The Vercel build itself is driven by the
# root vercel.json (pnpm monorepo → apps/web static export).

on:
  push:
    branches:
      - claude/tolatino-repo-setup-1efdil
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Deploy (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tee deploy-url.txt
          echo "### 🚀 Desplegado en Vercel" >> "$GITHUB_STEP_SUMMARY"
          echo "$(tail -1 deploy-url.txt)" >> "$GITHUB_STEP_SUMMARY"
