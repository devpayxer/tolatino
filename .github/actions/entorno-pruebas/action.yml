name: Entorno de pruebas
description: >-
  9b-2 · Lo mismo que se levanta en la máquina de pruebas, desechable: la web ya construida (artefacto «web»), una base NUEVA con migraciones y semilla
  del sandbox, Garage, los recursos de terceros, Playwright con sus navegadores y el servidor en :3100 con el perfil completo (los simuladores).
  Nada de esto toca el sandbox ni producción; los secretos de la corrida los genera pruebas/servir/servir.sh al azar en una carpeta FUERA del repo.
inputs:
  navegadores:
    description: Navegadores de Playwright que se instalan
    default: chromium webkit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with: { name: web, path: "${{ runner.temp }}/web" }
    - name: La web construida en su sitio
      shell: bash
      run: tar xzf "$RUNNER_TEMP/web/web.tgz" -C "$GITHUB_WORKSPACE"
    # Python 3.12 fijo: el del runner cambia y onnxruntime 1.23.2 (la moderación de fotos, requirements.txt) no tiene paquete para los nuevos.
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - name: Pillow para las fotos de prueba (recursos.sh)
      shell: bash
      run: |
        # 20 nov · Cada paso que baja algo de la red lleva tope de tiempo y UN reintento: dos trabajos de dispositivos se quedaron 40 min
        # colgados aquí (CI 44771585360) y una parte del iPhone SE tardó 78 min por lo mismo (44755954339). Sin tope, un cuelgue de la red
        # se come el trabajo entero. `reintenta <segundos> <comando…>` queda definida para los pasos siguientes.
        cat > "$RUNNER_TEMP/reintenta.sh" <<'FIN'
        reintenta() { local t="$1"; shift; timeout -k 15 "$t" "$@" && return 0; echo "::warning::«$*» no terminó en $t s o falló: se intenta una vez más" >&2; sleep 5; timeout -k 15 "$t" "$@"; }
        FIN
        # 20 nov (CI 44793647835) · Dos trabajos cayeron AQUÍ por el propio tope: `apt-get install` pasó de 420 s (el «man-db» de las máquinas de
        # GitHub reconstruye su índice en cada instalación y a veces tarda minutos), el tope cortó a sudo pero apt siguió vivo con el candado
        # puesto, y el reintento murió en «Could not get lock». Ahora: sin el índice de man-db (no lo usa nadie aquí), apt ESPERA el candado en vez
        # de fallar, y cada intento de instalar empieza terminando lo que el anterior dejó a medias. El aviso del reintento sale por el canal
        # de errores (con «> /dev/null» no se veía).
        sudo rm -f /var/lib/man-db/auto-update
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-espera-el-candado > /dev/null
        # 20 nov (CI 44800496337) · Aun así dos máquinas se quedaron: apt (el nuestro y el de Playwright) colgado ANTES de instalar, las dos
        # veces, mientras las demás tardaron 40-78 s. Es la red de esa máquina hacia el espejo de paquetes. apt va solo por IPv4 (el cuelgue
        # clásico de estas máquinas es una ruta IPv6 que no contesta), corta una conexión muda a los 20 s y reintenta 5 veces. Y lo que apt
        # y Playwright digan queda en un archivo que se enseña si el paso cae (antes iba a /dev/null: no se sabía dónde se quedaba).
        printf 'Acquire::ForceIPv4 "true";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-red-que-no-se-cuelga > /dev/null
        # 20 nov (CI 44807211977) · Tercera vez, y ahora con lo que dijo: nuestro apt ni llegó a empezar (su registro salió vacío) y el candado lo
        # tenía OTRO apt-get. La máquina arranca con una actualización del sistema en marcha (la imagen ubuntu-26.04 nueva) que puede tardar
        # más que nuestro tope; matarla a la fuerza (lo de antes) deja paquetes a medio configurar y `dpkg --configure -a` se queda con eso.
        # Ahora: se le pide que pare bien, se ESPERA a que suelte (hasta 15 min, diciendo cada minuto quién ocupa apt y desde cuándo) y los
        # servicios no se reinician al instalar (needrestart solo lista). Ya no se mata ningún apt que no sea el nuestro.
        sudo systemctl stop unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer 2> /dev/null || true
        printf '$nrconf{restart} = %s;\n$nrconf{kernelhints} = 0;\n' "'l'" | sudo tee /etc/needrestart/conf.d/99-solo-lista.conf > /dev/null 2>&1 || true
        t=0
        while pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null || pgrep -f unattended-upgr > /dev/null; do
          if [ $((t % 60)) -eq 0 ]; then echo "::notice::apt del sistema ocupado desde hace ${t} s:"; ps -eo pid,etimes,args | grep -E "[a]pt-get|[d]pkg|[u]nattended" | cut -c1-200; fi
          sleep 5; t=$((t + 5))
          if [ "$t" -ge 900 ]; then echo "::warning::el apt del sistema sigue ocupado tras 15 min: se sigue igual"; break; fi
        done
        cat > "$RUNNER_TEMP/instala.sh" <<'FIN'
        #!/bin/bash
        L="$RUNNER_TEMP/apt.log"
        trap 'echo "--- apt cortado por el tope de tiempo; lo último que dijo:" >&2; tail -n 25 "$L" >&2; sudo pkill -9 -x apt-get; sudo pkill -9 -x dpkg; exit 124' TERM
        sudo dpkg --configure -a > "$L" 2>&1 || true
        sudo apt-get install -y -q "$@" > "$L" 2>&1 &
        wait $! || { echo "--- apt falló; lo último que dijo:" >&2; tail -n 25 "$L" >&2; exit 1; }
        FIN
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 180 python3 -m pip install -q pillow
    - name: Herramientas de las pruebas (versiones exactas) y navegadores
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 300 sudo apt-get update -qq
        reintenta 420 bash "$RUNNER_TEMP/instala.sh" psmisc ffmpeg > /dev/null  # C-001: ffmpeg para el servicio de video propio (vid001 lo levanta en :8791)
        reintenta 300 npm ci --ignore-scripts --prefix pruebas/herramientas > /dev/null
        (cd pruebas/herramientas && reintenta 600 npx playwright install --with-deps ${{ inputs.navegadores }} > "$RUNNER_TEMP/playwright.log") || { echo "--- Playwright no terminó de instalar; lo último que dijo:"; tail -n 30 "$RUNNER_TEMP/playwright.log"; exit 1; }
        echo "NODE_PATH=$GITHUB_WORKSPACE/pruebas/herramientas/node_modules" >> "$GITHUB_ENV"
        echo "PRUEBAS_SALIDA=$RUNNER_TEMP/salida" >> "$GITHUB_ENV"
    - name: Una segunda dirección de esta máquina (llave8d prueba una página que NO es localhost, sin contexto seguro)
      shell: bash
      run: sudo ip addr add 192.0.2.2/32 dev lo
    - name: Una base NUEVA (migraciones + semilla del sandbox + ayuda) y Garage
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 600 bash pruebas/servir/base.sh
    - name: Recursos de terceros de las pruebas
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 420 bash pruebas/servir/recursos.sh
    - name: El servidor (sin construir, la web viene del artefacto)
      shell: bash
      env: { SOLO: servir }
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 300 bash pruebas/servir/servir.sh completo
