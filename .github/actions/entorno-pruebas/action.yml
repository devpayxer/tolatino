name: Entorno de pruebas
description: >-
  9b-2 · Lo mismo que se levanta en la máquina de pruebas, desechable: la web ya construida (artefacto «web»), una base NUEVA con migraciones y semilla
  del sandbox, Garage, los recursos de terceros, Playwright con sus navegadores y el servidor en :3100 con el perfil completo (los simuladores).
  Nada de esto toca el sandbox ni producción; los secretos de la corrida los genera pruebas/servir/servir.sh al azar en una carpeta FUERA del repo.
inputs:
  navegadores:
    description: Navegadores de Playwright que se instalan
    default: chromium webkit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with: { name: web, path: "${{ runner.temp }}/web" }
    - name: La web construida en su sitio
      shell: bash
      run: tar xzf "$RUNNER_TEMP/web/web.tgz" -C "$GITHUB_WORKSPACE"
    # Python 3.12 fijo: el del runner cambia y onnxruntime 1.23.2 (la moderación de fotos, requirements.txt) no tiene paquete para los nuevos.
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - name: Pillow para las fotos de prueba (recursos.sh)
      shell: bash
      run: |
        # 20 nov · Cada paso que baja algo de la red lleva tope de tiempo y UN reintento: dos trabajos de dispositivos se quedaron 40 min
        # colgados aquí (CI 44771585360) y una parte del iPhone SE tardó 78 min por lo mismo (44755954339). Sin tope, un cuelgue de la red
        # se come el trabajo entero. `reintenta <segundos> <comando…>` queda definida para los pasos siguientes.
        cat > "$RUNNER_TEMP/reintenta.sh" <<'FIN'
        reintenta() { local t="$1"; shift; timeout "$t" "$@" && return 0; echo "::warning::«$*» no terminó en $t s o falló: se intenta una vez más"; sleep 5; timeout "$t" "$@"; }
        FIN
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 180 python3 -m pip install -q pillow
    - name: Herramientas de las pruebas (versiones exactas) y navegadores
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 300 sudo apt-get update -qq
        reintenta 420 sudo apt-get install -y -qq psmisc ffmpeg > /dev/null  # C-001: ffmpeg para el servicio de video propio (vid001 lo levanta en :8791)
        reintenta 300 npm ci --ignore-scripts --prefix pruebas/herramientas > /dev/null
        (cd pruebas/herramientas && reintenta 600 npx playwright install --with-deps ${{ inputs.navegadores }} > /dev/null)
        echo "NODE_PATH=$GITHUB_WORKSPACE/pruebas/herramientas/node_modules" >> "$GITHUB_ENV"
        echo "PRUEBAS_SALIDA=$RUNNER_TEMP/salida" >> "$GITHUB_ENV"
    - name: Una segunda dirección de esta máquina (llave8d prueba una página que NO es localhost, sin contexto seguro)
      shell: bash
      run: sudo ip addr add 192.0.2.2/32 dev lo
    - name: Una base NUEVA (migraciones + semilla del sandbox + ayuda) y Garage
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 600 bash pruebas/servir/base.sh
    - name: Recursos de terceros de las pruebas
      shell: bash
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 420 bash pruebas/servir/recursos.sh
    - name: El servidor (sin construir, la web viene del artefacto)
      shell: bash
      env: { SOLO: servir }
      run: |
        . "$RUNNER_TEMP/reintenta.sh"
        reintenta 300 bash pruebas/servir/servir.sh completo
