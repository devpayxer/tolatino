name: Entorno de pruebas
description: >-
  9b-2 · Lo mismo que se levanta en la máquina de pruebas, desechable: la web ya construida (artefacto «web»), una base NUEVA con migraciones y semilla
  del sandbox, Garage, los recursos de terceros, Playwright con sus navegadores y el servidor en :3100 con el perfil completo (los simuladores).
  Nada de esto toca el sandbox ni producción; los secretos de la corrida los genera pruebas/servir/servir.sh al azar en una carpeta FUERA del repo.
inputs:
  navegadores:
    description: Navegadores de Playwright que se instalan
    default: chromium webkit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with: { name: web, path: "${{ runner.temp }}/web" }
    - name: La web construida en su sitio
      shell: bash
      run: tar xzf "$RUNNER_TEMP/web/web.tgz" -C "$GITHUB_WORKSPACE"
    - name: Herramientas de las pruebas (versiones exactas) y navegadores
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq psmisc python3-pil > /dev/null
        npm ci --ignore-scripts --prefix pruebas/herramientas > /dev/null
        (cd pruebas/herramientas && npx playwright install --with-deps ${{ inputs.navegadores }} > /dev/null)
        echo "NODE_PATH=$GITHUB_WORKSPACE/pruebas/herramientas/node_modules" >> "$GITHUB_ENV"
        echo "PRUEBAS_SALIDA=$RUNNER_TEMP/salida" >> "$GITHUB_ENV"
    - name: Una base NUEVA (migraciones + semilla del sandbox + ayuda) y Garage
      shell: bash
      run: bash pruebas/servir/base.sh
    - name: Recursos de terceros de las pruebas
      shell: bash
      run: bash pruebas/servir/recursos.sh
    - name: El servidor (sin construir, la web viene del artefacto)
      shell: bash
      env: { SOLO: servir }
      run: bash pruebas/servir/servir.sh completo
