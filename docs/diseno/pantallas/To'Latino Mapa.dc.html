      onUp: () => { if (this._drag) { this._drag = null; this.forceUpdate(); } },
      onMapClick: () => { if (this._moved) { this._moved = false; return; } if (this.state.sel) this.setState({ sel: null }); },
      hasSel: !!sel, sel: sel ? Object.assign(row(sel), { approx: approx(sel), approxL: E2('Trabaja desde casa: el pin es la zona. La dirección exacta te llega al confirmar.', 'Works from home: the pin is the area. The exact address arrives on confirmation.'), openL: E2('Ver negocio', 'See business'), dirL: E2('Cómo llegar', 'Directions'), onOpen: () => open(sel.id), onDir: () => this.api().directions(sel.id) }) : { approx: false },
      closeSel: e => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ sel: null }); },
      listK: (L2.length + ' ' + E2(L2.length === 1 ? 'NEGOCIO' : 'NEGOCIOS', L2.length === 1 ? 'BUSINESS' : 'BUSINESSES') + E2(' · EL MÁS CERCA PRIMERO', ' · NEAREST FIRST')) + (ids ? E2(' · TUS FILTROS', ' · YOUR FILTERS') : ''),
      rows, hasMore: L2.length > s.n, moreL: E2('Ver ' + Math.min(20, L2.length - s.n) + ' más', 'See ' + Math.min(20, L2.length - s.n) + ' more'), onMore: () => this.setState(z0 => ({ n: z0.n + 20 })),
      empty: !L2.length, emptyT: E2('Nada con ese filtro', 'Nothing with that filter'), emptyS: E2('Quita un filtro o amplía el radio.', 'Remove a filter or widen the radius.'),
      hasClear: s.f !== 'all' || s.cat !== 'all', clearL: E2('Quitar filtros', 'Clear filters'), onClear: () => this.setState({ f: 'all', cat: 'all', sel: null }),
      hasNoPin: noPin > 0, noPinL: noPin === 1 ? E2('1 negocio no tiene local (va a domicilio o atiende por teléfono): sale en la lista, no en el mapa.', '1 business has no venue (comes to you or works by phone): it is listed, not pinned.') : E2(noPin + ' negocios no tienen local (van a domicilio o atienden por teléfono): salen en la lista, no en el mapa.', noPin + ' businesses have no venue (they come to you or work by phone): they are listed, not pinned.')
    });
  }
