<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/to-latino-design-system-d2663232-04f6-45a5-908b-d9e3f8cc8e08/tokens/fonts.css">
<link rel="stylesheet" href="_ds/to-latino-design-system-d2663232-04f6-45a5-908b-d9e3f8cc8e08/tokens/colors.css">
<link rel="stylesheet" href="_ds/to-latino-design-system-d2663232-04f6-45a5-908b-d9e3f8cc8e08/styles.css">
<script src="_ds/to-latino-design-system-d2663232-04f6-45a5-908b-d9e3f8cc8e08/_ds_bundle.js"></script>
<script src="prototype/onb-neg-data.js"></script>
<script src="prototype/com-data.js"></script>
<script src="prototype/adm-data.js"></script>
<script src="prototype/web-pages.js"></script>
<style>body{margin:0}a{color:#4B37F5;text-decoration:none}a:hover{color:#2E1FD1}</style>
</helmet>
<div data-screen-label="{{ scr }}" style="min-height:100%;background:#F7F6F3;color:#0B0E12;font-family:Manrope,sans-serif">
<sc-if value="{{ mob }}" hint-placeholder-val="{{ true }}">
<div style="position:sticky;top:0;z-index:20;padding:12px 16px;background:#fff;border-bottom:1px solid rgba(11,14,18,.07);display:flex;align-items:center;gap:12px">
  <span onClick="{{ onBack }}" style="width:34px;height:34px;border-radius:11px;background:#F7F6F3;display:grid;place-items:center;cursor:pointer;flex:none"><x-import component-from-global-scope="ToLatinoDesignSystem_d26632.Icon" name="chevronLeft" size="{{ 16 }}" stroke-width="{{ 2 }}" hint-size="16px,16px"></x-import></span>
  <div style="flex:1;min-width:0"><div style="font:800 15px/1.2 Sora,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t }}</div><div style="margin-top:3px;font:600 9px 'JetBrains Mono',monospace;letter-spacing:.06em;color:rgba(11,14,18,.5)">{{ grpK }}</div></div>
</div>
</sc-if>
<div style="max-width:{{ lay.max }};margin:0 auto;padding:{{ lay.pad }};display:grid;grid-template-columns:{{ lay.cols }};gap:{{ lay.gap }};align-items:start">
  <div style="min-width:0;display:flex;flex-direction:column;gap:18px">
    <sc-if value="{{ dsk }}" hint-placeholder-val="{{ false }}"><div onClick="{{ onBack }}" style="display:inline-flex;align-items:center;gap:6px;font:700 13px Manrope,sans-serif;color:#4B37F5;cursor:pointer"><x-import component-from-global-scope="ToLatinoDesignSystem_d26632.Icon" name="chevronLeft" size="{{ 15 }}" stroke-width="{{ 2 }}" hint-size="15px,15px"></x-import>{{ backL }}</div></sc-if>
    <div data-screen-label="Página · título" style="display:flex;flex-direction:column;gap:10px">
      <span style="font:700 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:rgba(11,14,18,.45)">{{ grpK }}</span>
      <h1 style="margin:0;font:800 {{ lay.h1 }}/1.08 Sora,sans-serif;letter-spacing:-.04em;text-wrap:balance">{{ t }}</h1>
      <p style="margin:0;font:500 15px/1.6 Manrope,sans-serif;color:rgba(11,14,18,.7);text-wrap:pretty">{{ lead }}</p>
      <span style="font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:.12em;color:rgba(11,14,18,.45)">{{ verL }}</span>
    </div>
    <sc-for list="{{ secs }}" as="s" hint-placeholder-count="3">
      <div data-screen-label="Página · sección" style="padding:18px;border-radius:18px;background:#fff;border:1px solid rgba(11,14,18,.07);display:flex;flex-direction:column;gap:10px">
        <sc-if value="{{ s.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0;font:800 17px/1.25 Sora,sans-serif;letter-spacing:-.02em">{{ s.h }}</h2></sc-if>
        <sc-if value="{{ s.hasP }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font:500 14px/1.6 Manrope,sans-serif;color:rgba(11,14,18,.75);text-wrap:pretty">{{ s.p }}</p></sc-if>
        <sc-if value="{{ s.hasLi }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:9px"><sc-for list="{{ s.li }}" as="x" hint-placeholder-count="3"><div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:6px;height:6px;margin-top:8px;border-radius:99px;background:#4B37F5"></span><span style="font:500 14px/1.55 Manrope,sans-serif;color:rgba(11,14,18,.78);text-wrap:pretty">{{ x.t }}</span></div></sc-for></div></sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px"><sc-for list="{{ ctas }}" as="c" hint-placeholder-count="2"><x-import component-from-global-scope="ToLatinoDesignSystem_d26632.Button" variant="{{ c.v }}" on-click="{{ c.on }}" hint-size="180px,46px">{{ c.l }}</x-import></sc-for></div></sc-if>
  </div>
  <sc-if value="{{ dsk }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:14px;position:sticky;top:20px">
    <div style="padding:6px 16px;border-radius:18px;background:#fff;border:1px solid rgba(11,14,18,.07)">
      <div style="padding:10px 0 4px;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:rgba(11,14,18,.42)">{{ moreK }}</div>
      <sc-for list="{{ more }}" as="m" hint-placeholder-count="4"><div onClick="{{ m.on }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid rgba(11,14,18,.06);cursor:pointer;font:700 13.5px Manrope,sans-serif;color:{{ m.fg }}">{{ m.l }}<x-import component-from-global-scope="ToLatinoDesignSystem_d26632.Icon" name="chevronRight" size="{{ 15 }}" stroke-width="{{ 2 }}" color="rgba(11,14,18,.4)" hint-size="15px,15px"></x-import></div></sc-for>
    </div>
    <div style="padding:16px;border-radius:18px;background:#0B0E12;color:#fff;display:flex;flex-direction:column;gap:10px">
      <span style="font:800 16px/1.3 Sora,sans-serif;letter-spacing:-.02em">{{ askT }}</span>
      <span style="font:500 13px/1.5 Manrope,sans-serif;color:rgba(255,255,255,.75)">{{ askS }}</span>
      <div style="display:flex"><x-import component-from-global-scope="ToLatinoDesignSystem_d26632.Button" variant="action" block="{{ true }}" on-click="{{ onAsk }}" hint-size="100%,44px">{{ askL }}</x-import></div>
    </div>
  </div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;k&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;help&quot;, &quot;faq&quot;, &quot;plans&quot;, &quot;pay&quot;, &quot;chair&quot;, &quot;rules&quot;, &quot;votes&quot;, &quot;verif&quot;, &quot;safe&quot;, &quot;app&quot;, &quot;terms&quot;, &quot;priv&quot;, &quot;cook&quot;, &quot;a11y&quot;], &quot;default&quot;: &quot;help&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;lang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;es&quot;, &quot;en&quot;], &quot;default&quot;: &quot;es&quot;, &quot;tsType&quot;: &quot;'es'|'en'&quot;}, &quot;desk&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;dw&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;api&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}}">
class Component extends DCLogic {
  state = { k: null };
  componentDidMount() { if (!window.TLWeb) this._w = setInterval(() => { if (window.TLWeb) { clearInterval(this._w); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this._w); }
  go(k) { const api = this.props.api; if (api && api.go) api.go(k); else this.setState({ k }); }
  renderVals() {
    const W = window.TLWeb, es = (this.props.lang || 'es') === 'es', E2 = (a, b) => es ? a : b, T = x => Array.isArray(x) ? (es ? x[0] : x[1]) : x;
    const desk = !!this.props.desk, dw = this.props.dw || 1280, two = desk && dw >= 1000;
    const lay = { max: two ? '1120px' : desk ? '760px' : 'none', pad: desk ? '24px 32px 56px' : '18px 16px 28px', cols: two ? 'minmax(0,1fr) 300px' : 'minmax(0,1fr)', gap: two ? '48px' : '0', h1: desk ? '40px' : '28px' };
    const api = this.props.api || {}, onBack = () => (api.back ? api.back() : null);
    if (!W) return { scr: 'APP-WEB', mob: !desk, dsk: desk, lay, t: '', lead: '', grpK: '', verL: '', secs: [], ctas: [], hasCta: false, more: [], moreK: '', backL: '', onBack, askT: '', askS: '', askL: '', onAsk: () => {} };
    const k = W.P[this.state.k || this.props.k] ? (this.state.k || this.props.k) : 'help', p = W.P[k], val = v => typeof v === 'function' ? v() : v;
    const v = W.ver(k), MO = es ? ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'] : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const when = v.at ? (d => es ? d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear() : MO[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear())(new Date(v.at)) : (es ? v.d : v.d);
    const secs = val(p.s).map(s => ({ hasH: !!s.h, h: s.h ? T(s.h) : '', hasP: !!s.p, p: s.p ? T(s.p) : '', hasLi: !!(s.li && s.li.length), li: (s.li || []).map(x => ({ t: T(x) })) }));
    const ACT = { soporte: () => api.soporte && api.soporte(), publica: () => api.publica && api.publica(), panel: () => api.panel && api.panel(), comunidad: () => api.comunidad && api.comunidad(), rangos: () => api.rangos && api.rangos(), inicio: () => api.inicio && api.inicio() };
    const ctas = (p.cta || []).map(([a, l], i) => ({ l: T(l), v: i === 0 ? 'primary' : 'secondary', on: ACT[a] || (() => this.go(a)) }));
    const more = W.keys.filter(x => W.P[x].g === p.g || (W.G[W.P[x].g] && W.G[W.P[x].g][0] === W.G[p.g][0])).map(x => ({ l: T(W.P[x].t), fg: x === k ? '#4B37F5' : '#0B0E12', on: () => this.go(x) }));
    return { scr: 'APP-WEB · ' + k, mob: !desk, dsk: desk, lay, onBack, backL: E2('Volver', 'Back'),
      t: T(p.t), lead: T(val(p.lead)), grpK: T(W.G[p.g]).toUpperCase(), verL: E2('VERSIÓN ', 'VERSION ') + v.v + E2(' · VIGENTE DESDE ', ' · EFFECTIVE ') + String(when).toUpperCase(),
      secs, ctas, hasCta: ctas.length > 0, more, moreK: E2('MÁS EN ', 'MORE IN ') + T(W.G[p.g]).toUpperCase(),
      askT: E2('¿No encontraste lo que buscas?', 'Didn\u2019t find what you need?'), askS: E2('Escríbenos y te responde una persona del equipo.', 'Write to us and a person on the team replies.'), askL: E2('Escríbenos', 'Write to us'), onAsk: ACT.soporte };
  }
}
</script>
</body>
</html>
